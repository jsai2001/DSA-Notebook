<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Unlisted page: keep it out of search results. Not linked from the main site. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Coding Solutions | Jeevan Sai Kanaparthi</title>
    <!-- Apply the saved theme before the page paints, so dark mode doesn't flash white.
         Default is light; only switches to dark if the user chose it before. -->
    <script>
      try {
        if (localStorage.getItem("solutions-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {
        /* storage unavailable; stay light */
      }
    </script>
    <link rel="stylesheet" href="./solutions.css" />
  </head>
  <body>
    <header class="page-header">
      <!-- Light/dark toggle: icon only, fixed at the top right so it's always reachable -->
      <button type="button" id="theme-toggle" class="theme-toggle" title="Switch theme">
        <span class="theme-icon" aria-hidden="true">☾</span>
        <span class="theme-label visually-hidden">Dark mode</span>
      </button>
      <h1 class="title">Coding Solutions</h1>
      <p class="subtitle">My notes and solutions. Click a question to expand it.</p>
      <!-- Difficulty and topic chips, built by app.js from the cards; they combine with search -->
      <div class="filters" id="filters">
        <div class="filter-group" id="filter-difficulty" role="group" aria-label="Filter by difficulty"></div>
        <div class="filter-group is-topics" id="filter-topics" role="group" aria-label="Filter by topic"></div>
        <p class="filter-count" id="filter-count" aria-live="polite"></p>
      </div>
      <p id="no-results" hidden>No questions match your search.</p>
      <!-- Announces the picked question to screen readers -->
      <p id="surprise-status" class="visually-hidden" aria-live="polite"></p>
    </header>

    <main id="question-list">
      <!-- PROBLEMS -->
    </main>

    <!-- Floating bar, bottom center: search and Surprise me, reachable while reading.
         The search box opens inside the bar when the magnifier is pressed. -->
    <div class="dock" id="dock" role="toolbar" aria-label="Search and Surprise me">
      <button type="button" id="search-toggle" class="dock-btn" title="Search by name or tag (/)"
        aria-label="Search questions" aria-expanded="false" aria-controls="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </button>
      <label for="search" class="visually-hidden">Search questions</label>
      <input id="search" type="search" placeholder="Search by name or tag..." autocomplete="off" hidden />
      <button type="button" id="surprise" class="dock-btn" title="Surprise me (R)"
        aria-label="Surprise me: open a random question">
        <!-- Shuffle icon; uses currentColor so it follows the theme -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <polyline points="16 3 21 3 21 8" />
          <line x1="4" y1="20" x2="21" y2="3" />
          <polyline points="21 16 21 21 16 21" />
          <line x1="15" y1="15" x2="21" y2="21" />
          <line x1="4" y1="4" x2="9" y2="9" />
        </svg>
      </button>
    </div>

    <!-- Visualizer engine, then each approach's visualizer, then the page script -->
    <script src="./viz.js"></script>
    <!-- VISUALS -->
    <script src="./app.js"></script>
  </body>
</html>
