<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Unlisted page: keep it out of search results. Not linked from the main site. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Coding Solutions | Jeevan Sai Kanaparthi</title>
    <!-- Apply the saved theme before the page paints, so dark mode doesn't flash white.
         Default is light; only switches to dark if the user chose it before. -->
    <script>
      try {
        if (localStorage.getItem("solutions-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {
        /* storage unavailable; stay light */
      }
    </script>
    <link rel="stylesheet" href="./solutions.css" />
  </head>
  <body>
    <header class="page-header">
      <button type="button" id="theme-toggle" class="theme-toggle">
        <span class="theme-icon" aria-hidden="true">☾</span>
        <span class="theme-label">Dark mode</span>
      </button>
      <h1 class="title">Coding Solutions</h1>
      <p class="subtitle">My notes and solutions. Click a question to expand it.</p>
      <div class="controls">
        <label for="search" class="visually-hidden">Search questions</label>
        <input
          id="search"
          type="search"
          placeholder="Search by name or tag..."
          autocomplete="off"
        />
        <button type="button" id="surprise" class="surprise-btn">
          <!-- Shuffle icon; uses currentColor so it follows the theme -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polyline points="16 3 21 3 21 8" />
            <line x1="4" y1="20" x2="21" y2="3" />
            <polyline points="21 16 21 21 16 21" />
            <line x1="15" y1="15" x2="21" y2="21" />
            <line x1="4" y1="4" x2="9" y2="9" />
          </svg>
          <span>Surprise me</span>
        </button>
      </div>
      <p id="no-results" hidden>No questions match your search.</p>
      <!-- Announces the picked question to screen readers -->
      <p id="surprise-status" class="visually-hidden" aria-live="polite"></p>
    </header>

    <main id="question-list">
      <!-- PROBLEMS -->
    </main>

    <script src="./app.js"></script>
  </body>
</html>
