    <p class="rev-crumb">AWS › 13. Hands-On: CloudFormation Templates › CloudWatch alarm for EC2</p>
      <p><strong>Q. How do you create a CloudWatch alarm for an EC2 instance with CloudFormation?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
Resources:
    MyCloudWatchAlarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            AlarmName: ec2-cpu-alarm
            MetricName: CPUUtilization
            Namespace: AWS/EC2
            Statistic: Average
            Period: 300
            EvaluationPeriods: 2
            Threshold: 80
            ComparisonOperator: GreaterThanThreshold
            Dimensions:
                - Name: InstanceId
                    Value: i-1234567890abcdef0
            AlarmActions:
                - arn:aws:sns:us-east-1:123456789012:my-topic
        </script>
      </div>
