  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">SQL › 13. Worked Examples › Remove duplicate records</p>
      <p>Number the rows within each group of identical records with <code>ROW_NUMBER</code>; every row with <code>row_num &gt; 1</code> is a duplicate. Run the <code>SELECT</code> to check, then switch to <code>DELETE</code> to remove them.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
WITH RowNumCTE AS(
Select *,
ROW_NUMBER() OVER (
PARTITION BY ParcelID,
PropertyAddress,
SalePrice,
SaleDate,
LegalReference
ORDER BY UniqueID) as row_num
From NashvilleHousing
)
--DELETE
Select * From RowNumCTE
Where row_num > 1
Order by PropertyAddress
        </script>
      </div>
