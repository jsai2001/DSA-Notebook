      <p>Sequential pipeline (agent1 → agent2 → coordinator), then a streaming node:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
class LangGraphMultiAgent:
    def __init__(self):
        self.setup_workflow()

    def setup_workflow(self):
        # Multi-agent workflow state
        class MultiAgentState(TypedDict):
            task: str
            agent1_result: str
            agent2_result: str
            final_output: str

        # Create workflow
        self.workflow = StateGraph(MultiAgentState)

        # Add agent nodes
        self.workflow.add_node("agent1", self.agent1_node)
        self.workflow.add_node("agent2", self.agent2_node)
        self.workflow.add_node("coordinator", self.coordinator_node)

        # Define collaboration flow
        self.workflow.add_edge("agent1", "agent2")
        self.workflow.add_edge("agent2", "coordinator")
        self.workflow.set_entry_point("agent1")

    def agent1_node(self, state: MultiAgentState):
        # Agent 1 processing
        return {"agent1_result": f"Agent1 processed: {state['task']}"}

    def agent2_node(self, state: MultiAgentState):
        # Agent 2 processing
        return {"agent2_result": f"Agent2 processed: {state['agent1_result']}"}

    def coordinator_node(self, state: MultiAgentState):
        # Combine results
        final = f"Combined: {state['agent1_result']} + {state['agent2_result']}"
        return {"final_output": final}

def create_streaming_workflow():
    workflow = StateGraph(WorkflowState)

    def streaming_node(state: WorkflowState):
        # Simulate streaming processing
        intermediate_results = []

        for i in range(3):
            result = f"Processing step {i+1}"
            intermediate_results.append(result)
            # In real implementation, this would stream to user
            yield {"current_step": f"step_{i+1}", "partial_result": result}

        return {"current_step": "completed", "final_result": intermediate_results}

    workflow.add_node("streaming_processor", streaming_node)
    return workflow.compile()
