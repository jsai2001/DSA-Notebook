    <section class="q-section rev-sec">
    <p class="rev-crumb">Ansible › 15. Provisioning AWS with Ansible › Attach a route table to a subnet</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Attach a route table to a subnet
  hosts: localhost
  tasks:
    - name: Create route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "vpc-12345678"
        region: "us-east-1"
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "igw-12345678"
      register: route_table
    - name: Associate route table with subnet
      amazon.aws.ec2_vpc_route_table_association:
        route_table_id: "{{ route_table.route_table_id }}"
        subnet_id: "subnet-12345678"
        region: "us-east-1"
        </script>
      </div>
