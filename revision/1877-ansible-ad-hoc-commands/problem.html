    <p class="rev-crumb">Ansible › 2. Installation and ansible.cfg › Ad-hoc commands</p>
      <p><strong>Q. Run a single task without a playbook?</strong> Use <code>ansible</code> with <code>-m</code> (module) and <code>-a</code> (args):</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible all -m ping
ansible webservers -m command -a "uptime"
        </script>
      </div>
      <p><strong>Q. What is <code>ansible-doc</code>?</strong> It shows module documentation, usage and parameters:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-doc apt
        </script>
      </div>
