    <p class="rev-crumb">AWS › 12. Hands-On: Provisioning with the AWS CLI › Create an ECS cluster and run a Fargate task</p>
      <p><strong>Q. How do you create an ECS cluster and deploy a task definition?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
# Create ECS cluster
aws ecs create-cluster \
    --cluster-name my-ecs-cluster \
    --region us-east-1
# Register task definition
aws ecs register-task-definition \
    --family my-task \
    --network-mode awsvpc \
    --requires-compatibilities FARGATE \
    --cpu "256" \
    --memory "512" \
    --execution-role-arn arn:aws:iam::123456789012:role/ecs-task-execution-role \
    --container-definitions '[{"name":"my-container","image":"amazon/amazon-ecs-sample","essential":true,"portMappings":[{"containerPort":80,"hostPort":80}]}]' \
    --region us-east-1
# Run task
aws ecs run-task \
    --cluster my-ecs-cluster \
    --task-definition my-task \
    --launch-type FARGATE \
    --network-configuration "awsvpcConfiguration={subnets=[subnet-12345678],securityGroups=[sg-12345678],assignPublicIp=ENABLED}" \
    --region us-east-1
        </script>
      </div>
