- name: Create an RDS snapshot
  hosts: localhost
  tasks:
    - name: Create RDS snapshot
      amazon.aws.rds_snapshot:
        db_instance_identifier: "my-rds-instance"
        db_snapshot_identifier: "my-rds-snapshot"
        region: "us-east-1"
