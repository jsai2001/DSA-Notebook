    <p class="rev-crumb">Docker › 19. On-Call: Logging and Debugging › Host journal logs</p>
      <p><strong>Q. How do you manage excessive journald logs?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
journalctl --disk-usage
journalctl --vacuum-size=500M
sudo vi /etc/systemd/journald.conf
# Set: SystemMaxUse=500M
sudo systemctl restart systemd-journald
        </script>
      </div>
      <p>Reduce log size and set limits. Balance retention and monitor after changes.</p>
