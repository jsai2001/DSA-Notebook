    <section class="q-section rev-sec">
    <p class="rev-crumb">Ansible › 15. Provisioning AWS with Ansible › Create a task definition and attach it to an ECS cluster</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create a task definition and attach it to an ECS cluster
  hosts: localhost
  tasks:
    - name: Create ECS task definition
      amazon.aws.ecs_taskdefinition:
        family: "my-task"
        network_mode: "awsvpc"
        cpu: "256"
        memory: "512"
        execution_role_arn: "arn:aws:iam::123456789012:role/ecs-task-execution-role"
        containers:
          - name: "my-container"
            image: "amazon/amazon-ecs-sample"
            essential: true
            portMappings:
              - containerPort: 80
                hostPort: 80
        region: "us-east-1"
    - name: Run task in ECS cluster
      amazon.aws.ecs_task:
        cluster: "my-ecs-cluster"
        task_definition: "my-task"
        launch_type: "FARGATE"
        network_configuration:
          awsvpc_configuration:
            subnets: ["subnet-12345678"]
            security_groups: ["sg-12345678"]
            assign_public_ip: "ENABLED"
        region: "us-east-1"
        </script>
      </div>
