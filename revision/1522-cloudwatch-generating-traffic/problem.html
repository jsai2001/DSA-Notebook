import time

api_url = "https://your-api-endpoint.com/api"
num_requests = 1000

for i in range(num_requests):
    try:
        response = requests.get(api_url)
        print(f"Request {i+1} - Status: {response.status_code}")
    except Exception as e:
        print(f"Request {i+1} failed: {e}")
    time.sleep(0.1)
