    <p class="rev-crumb">Terraform › 21. Terraform with Python › Write a Python script to create a Terraform variable file dynamically.</p>
      <p>Generate a <code>.tfvars</code> file with variable definitions in HCL or JSON format.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
import json

# Define variables
variables = {
    'instance_type': 't2.micro',
    'region': 'us-east-1',
    'ami_id': 'ami-12345678'
}

# Write to JSON .tfvars file
with open('terraform.tfvars.json', 'w') as f:
    json.dump(variables, f, indent=2)

# Alternatively, write to HCL .tfvars file
with open('terraform.tfvars', 'w') as f:
    for key, value in variables.items():
        f.write(f'{key} = "{value}"\n')
        </script>
