  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">GitHub Actions › 5. Caching, artifacts and performance › Cache examples</p>
      <p>Maven and Gradle with a fallback key:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
name: Cache Example
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Install dependencies
        run: mvn install
        </script>
      </div>
      <p>The key is the OS plus the <code>pom.xml</code> hash. <code>restore-keys</code> falls back to any Maven cache for the same OS.</p>
      <p>npm:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- uses: actions/cache@v3
  with:
    path: ~/.npm
    key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        </script>
      </div>
      <p>pip:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- uses: actions/cache@v3
  with:
    path: ~/.cache/pip
    key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        </script>
      </div>
