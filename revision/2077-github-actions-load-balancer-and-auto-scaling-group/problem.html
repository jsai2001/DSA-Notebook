    <p class="rev-crumb">GitHub Actions › 13. Hands-on: AWS resources from workflows › Load balancer and Auto Scaling group</p>
      <p>Create an application load balancer:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create Load Balancer
  run: |
    aws elbv2 create-load-balancer \
      --name my-alb \
      --subnets subnet-12345678 subnet-87654321 \
      --security-groups sg-12345678 \
      --scheme internet-facing \
      --type application
        </script>
      </div>
      <p>Create an Auto Scaling group from a launch template:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create Auto Scaling Group
  run: |
    aws autoscaling create-auto-scaling-group \
      --auto-scaling-group-name my-asg \
      --launch-template LaunchTemplateName=my-launch-template,Version=1 \
      --min-size 1 \
      --max-size 3 \
      --desired-capacity 2 \
      --vpc-zone-identifier subnet-12345678,subnet-87654321
        </script>
      </div>
