    <section class="q-section rev-sec">
    <p class="rev-crumb">SQL › 13. Worked Examples › Split a column by delimiter</p>
      <p>Uses <code>SUBSTRING(string, start, length)</code>, <code>CHARINDEX(substring, string, start)</code> and <code>LEN(string)</code>.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
SELECT PropertyAddress,
SUBSTRING(PropertyAddress, 1, CHARINDEX(',', PropertyAddress) -1 ) as Address,
SUBSTRING(PropertyAddress, CHARINDEX(',', PropertyAddress) + 1, LEN(PropertyAddress)) as City
From NashvilleHousing

ALTER TABLE NashvilleHousing
Add PropertySplitAddress Nvarchar(255);
ALTER TABLE NashvilleHousing
Add PropertySplitCity Nvarchar(255);

Update NashvilleHousing
SET PropertySplitAddress = SUBSTRING(PropertyAddress, 1, CHARINDEX(',', PropertyAddress) -1 )
Update NashvilleHousing
SET PropertySplitCity = SUBSTRING(PropertyAddress, CHARINDEX(',', PropertyAddress) + 1, LEN(PropertyAddress))
        </script>
