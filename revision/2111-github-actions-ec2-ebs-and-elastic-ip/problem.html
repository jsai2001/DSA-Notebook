  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">GitHub Actions › 13. Hands-on: AWS resources from workflows › EC2, EBS and Elastic IP</p>
      <p>Create and attach an EBS volume:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create and Attach EBS Volume
  run: |
    VOLUME_ID=$(aws ec2 create-volume \
      --availability-zone us-east-1a \
      --size 10 \
      --volume-type gp3 \
      --query VolumeId --output text)
    aws ec2 attach-volume \
      --volume-id $VOLUME_ID \
      --instance-id i-1234567890abcdef0 \
      --device /dev/xvdf
        </script>
      </div>
      <p>Create an Elastic IP and attach it to an instance:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create and Attach Elastic IP
  run: |
    EIP_ALLOC_ID=$(aws ec2 allocate-address --domain vpc --query AllocationId --output text)
    aws ec2 associate-address \
      --instance-id i-1234567890abcdef0 \
      --allocation-id $EIP_ALLOC_ID
        </script>
      </div>
      <p>Attach a security group to an instance:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Attach Security Group
  run: |
    aws ec2 modify-instance-attribute \
      --instance-id i-1234567890abcdef0 \
      --groups sg-12345678
        </script>
      </div>
