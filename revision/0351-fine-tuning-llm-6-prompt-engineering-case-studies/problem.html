        <script type="text/plain" data-lang="Python">
def validate_prompt_quality(prompt, domain):
    quality_checks = {
        'specificity': len(prompt.split()) > 10,
        'clarity': '?' in prompt or 'please' in prompt.lower(),
        'context': any(word in prompt.lower() for word in ['describe', 'provide', 'specify']),
        'actionability': any(word in prompt.lower() for word in ['select', 'choose', 'tell'])
    }

    domain_specific = {
        'customer_service': 'options' in prompt.lower(),
        'healthcare': 'symptoms' in prompt.lower(),
        'media': 'summarize' in prompt.lower(),
        'education': 'translate' in prompt.lower() or 'explain' in prompt.lower()
    }

    quality_checks.update({domain: domain_specific.get(domain, True)})

    return {
        'score': sum(quality_checks.values()) / len(quality_checks),
        'passed_checks': quality_checks,
        'recommendations': get_improvement_suggestions(quality_checks)
    }

def get_improvement_suggestions(checks):
    suggestions = []
    if not checks['specificity']:
        suggestions.append("Add more specific details and requirements")
    if not checks['clarity']:
        suggestions.append("Include clear questions or instructions")
    if not checks['context']:
        suggestions.append("Provide more contextual guidance")
    return suggestions
        </script>
