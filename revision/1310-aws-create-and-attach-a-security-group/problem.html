    <p class="rev-crumb">AWS › 12. Hands-On: Provisioning with the AWS CLI › Create and attach a security group</p>
      <p><strong>Q. How do you create a security group and attach it to an EC2 instance?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
# Create security group
aws ec2 create-security-group \
    --group-name my-security-group \
    --description "My security group" \
    --vpc-id vpc-12345678 \
    --region us-east-1
# Add inbound rule
aws ec2 authorize-security-group-ingress \
    --group-id sg-12345678 \
    --protocol tcp \
    --port 22 \
    --cidr 0.0.0.0/0 \
    --region us-east-1
# Attach to EC2 instance
aws ec2 modify-instance-attribute \
    --instance-id i-1234567890abcdef0 \
    --groups sg-12345678 \
    --region us-east-1
        </script>
      </div>
