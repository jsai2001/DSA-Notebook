# Retrieval-Augmented Generation chatbot
from langchain.chains import RetrievalQA
from langchain.prompts import PromptTemplate

class PersonalizedChatbot:
    def __init__(self, retriever, llm):
        self.retriever = retriever
        self.llm = llm
        self.setup_qa_chain()

    def setup_qa_chain(self):
        """Setup QA chain with custom prompt"""
        prompt_template = """
        Use the following context to answer the question. If you don't know the answer based on the context, say so.

        Context: {context}
        Question: {question}
        Answer:
        """
        prompt = PromptTemplate(
            template=prompt_template,
            input_variables=["context", "question"]
        )
        self.qa_chain = RetrievalQA.from_chain_type(
            llm=self.llm,
            chain_type="stuff",
            retriever=self.retriever,
            return_source_documents=True,
            chain_type_kwargs={"prompt": prompt}
        )

    def chat(self, question: str) -> dict:
        """Process user question and return answer"""
        try:
            result = self.qa_chain.invoke({"query": question})
            return {
                "answer": result["result"],
                "sources": [doc.page_content[:200] + "..." for doc in result["source_documents"]],
                "success": True
            }
        except Exception as e:
            return {
                "answer": f"Sorry, I encountered an error: {str(e)}",
                "sources": [],
                "success": False
            }

# Initialize chatbot
chatbot = PersonalizedChatbot(retriever, llm)

# Test chatbot
response = chatbot.chat("What is the main topic of the documents?")
print(f"Answer: {response['answer']}")
print(f"Sources: {len(response['sources'])} documents referenced")
        </script>
