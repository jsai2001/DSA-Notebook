    <p class="rev-crumb">GitHub Actions › 7. Ready-made workflows › Deploying to AWS</p>
      <p><strong>Q. How do you deploy to AWS (or another cloud)?</strong> Use the provider's action, such as <code>aws-actions/configure-aws-credentials</code>, with credentials from secrets.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - run: aws s3 sync ./dist/ s3://my-bucket/
        </script>
