    <p class="rev-crumb">AWS › 18. Terraform for AWS: EKS, VPC, S3, RDS and IAM › VPC peering</p>
      <p><strong>Q. How do you set up VPC peering in Terraform?</strong> Create the peering connection, then add a route in each VPC to the other's CIDR.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Hcl">
resource "aws_vpc" "vpc_a" { cidr_block = "10.0.0.0/16" }
resource "aws_vpc" "vpc_b" { cidr_block = "10.1.0.0/16" }
resource "aws_vpc_peering_connection" "peer" {
  vpc_id        = aws_vpc.vpc_a.id
  peer_vpc_id   = aws_vpc.vpc_b.id
  auto_accept   = true
}
resource "aws_route" "vpc_a_route" {
  route_table_id            = aws_vpc.vpc_a.main_route_table_id
  destination_cidr_block    = aws_vpc.vpc_b.cidr_block
  vpc_peering_connection_id = aws_vpc_peering_connection.peer.id
}
resource "aws_route" "vpc_b_route" {
  route_table_id            = aws_vpc.vpc_b.main_route_table_id
  destination_cidr_block    = aws_vpc.vpc_a.cidr_block
  vpc_peering_connection_id = aws_vpc_peering_connection.peer.id
}
        </script>
