  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">Ansible › 9. Advanced Features and Scaling › Forks example</p>
      <p>Inventory of ten local hosts (<code>host1</code> to <code>host10</code> follow the same pattern):</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Ini">
[webservers]
host1 ansible_host=localhost ansible_connection=local
host2 ansible_host=localhost ansible_connection=local
host3 ansible_host=localhost ansible_connection=local
        </script>
      </div>
      <p>Playbook <code>forks_example.yml</code>:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Demonstrate forks in Ansible
  hosts: webservers
  tasks:
    - name: Simulate a task with a delay
      ansible.builtin.command: sleep 2
      register: result

    - name: Output the result
      ansible.builtin.debug:
        msg: "Task completed on {{ inventory_hostname }}"
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook -i inventory.ini forks_example.yml          # default 5 forks: ~4 seconds
ansible-playbook -i inventory.ini forks_example.yml -f 10    # 10 forks: ~2 seconds
        </script>
      </div>
      <p>Set it globally:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Ini">
[defaults]
forks = 20
        </script>
      </div>
