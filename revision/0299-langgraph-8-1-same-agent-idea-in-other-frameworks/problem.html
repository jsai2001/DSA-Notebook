        <script type="text/plain" data-lang="Python">
# CrewAI for specialized agent teams
from crewai import Agent, Task, Crew

# Define agents
researcher = Agent(
    role='Research Analyst',
    goal='Gather comprehensive information on given topics',
    backstory='Expert at finding and analyzing information',
    verbose=True
)

writer = Agent(
    role='Content Writer',
    goal='Create engaging content based on research',
    backstory='Skilled at transforming research into compelling narratives',
    verbose=True
)

# Define tasks
research_task = Task(
    description='Research the latest trends in AI agents',
    agent=researcher
)

writing_task = Task(
    description='Write a blog post about AI agent trends',
    agent=writer
)

# Create crew
crew = Crew(
    agents=[researcher, writer],
    tasks=[research_task, writing_task],
    verbose=2
)

# Execute
result = crew.kickoff()

def llamaindex_practice_project():
    """Build a research assistant with LlamaIndex"""
    from llama_index.core import VectorStoreIndex, SimpleDirectoryReader

    # Load documents
    documents = SimpleDirectoryReader("research_papers/").load_data()

    # Create index
    index = VectorStoreIndex.from_documents(documents)

    # Create agent
    agent = index.as_chat_engine(chat_mode="react", verbose=True)

    return agent
