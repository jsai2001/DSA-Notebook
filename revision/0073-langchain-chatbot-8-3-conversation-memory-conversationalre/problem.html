# Add conversation memory
from langchain.memory import ConversationBufferMemory
from langchain.chains import ConversationalRetrievalChain

class ConversationalChatbot:
    def __init__(self, retriever, llm):
        self.retriever = retriever
        self.llm = llm
        self.memory = ConversationBufferMemory(
            memory_key="chat_history",
            return_messages=True
        )
        self.setup_conversation_chain()

    def setup_conversation_chain(self):
        """Setup conversational chain with memory"""
        self.conversation_chain = ConversationalRetrievalChain.from_llm(
            llm=self.llm,
            retriever=self.retriever,
            memory=self.memory,
            return_source_documents=True
        )

    def chat(self, question: str) -> dict:
        """Chat with conversation memory"""
        try:
            result = self.conversation_chain.invoke({"question": question})
            return {
                "answer": result["answer"],
                "sources": [doc.page_content[:200] + "..." for doc in result["source_documents"]],
                "success": True
            }
        except Exception as e:
            return {
                "answer": f"Error: {str(e)}",
                "sources": [],
                "success": False
            }

    def clear_memory(self):
        """Clear conversation history"""
        self.memory.clear()

# Usage with memory
conversational_bot = ConversationalChatbot(retriever, llm)
response1 = conversational_bot.chat("What is the document about?")
response2 = conversational_bot.chat("Can you elaborate on that?")  # Uses context
