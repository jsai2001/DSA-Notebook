    <p class="rev-crumb">SQL › 13. Worked Examples › Invoices for customers with a balance of $1,000 or more</p>
      <p>Show invoice number, customer number, customer name, invoice date and invoice amount.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
select invoice_num, c.cust_num, c.cust_lname, c.cust_fname, inv_date, inv_amount
from customer c, invoice
where c.cust_num=invoice.cust_num and cust_balance>=1000

select invoice_num, c.cust_num, cust_lname+' '+cust_fname as [Name],
inv_date, inv_amount
from customer c join invoice i
on c.cust_num=i.cust_num
where cust_balance>=1000
        </script>
