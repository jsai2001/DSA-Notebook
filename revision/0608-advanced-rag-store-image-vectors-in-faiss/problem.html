    <p class="rev-crumb">Advanced RAG › 9. Image Search Demos › Store image vectors in FAISS</p>
      <p>Same pattern as text RAG: base64-encode each image as <code>page_content</code>, store the file path as metadata. (<code>encode_image</code> is reused in every later image demo.)</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from langchain.schema import Document
from langchain_community.vectorstores import FAISS
from langchain_community.embeddings import OpenCLIPEmbeddings
import glob
import base64

image_paths = glob.glob("images/*.jpg")

def encode_image(file_path: str) -> str:
    """Read file bytes, return UTF-8 base64 string (for the LLM later)."""
    with open(file_path, "rb") as f:
        return base64.b64encode(f.read()).decode("utf-8")

all_docs = []
for path in image_paths:
    encoded = encode_image(path)
    doc = Document(
        page_content=encoded,          # base64 encoded image
        metadata={"image_path": path}  # store the file path
    )
    all_docs.append(doc)

embedding_function = OpenCLIPEmbeddings()
vector_store = FAISS.from_documents(
    documents=all_docs,
    embedding=embedding_function
)
        </script>
