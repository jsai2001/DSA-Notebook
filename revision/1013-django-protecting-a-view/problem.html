      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from django.contrib.auth.decorators import login_required

@login_required(login_url='/admin')
def authorized(request):
    return render(request, 'home/authorized.html', {})
        </script>

      <ul>
        <li>Logged in: page renders. Not logged in: without <code>login_url</code> the result is a 404; with <code>login_url</code> the user is redirected to the login page.</li>
        <li>A whole auth system gated by one decorator.</li>
