    <p class="rev-crumb">Terraform › 15. Hands-On: IAM, Serverless, Messaging, Containers and Monitoring › Create a Task Definition and Attach it to an ECS Cluster using Terraform</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Hcl">
resource "aws_ecs_task_definition" "my_task" {
    family                   = "my-task"
    network_mode             = "awsvpc"
    requires_compatibilities = ["FARGATE"]
    cpu                      = "256"
    memory                   = "512"
    execution_role_arn       = "arn:aws:iam::123456789012:role/ecs-task-execution-role"
    container_definitions    = jsonencode([{
        name  = "my-container"
        image = "amazon/amazon-ecs-sample"
        essential = true
        portMappings = [{
            containerPort = 80
            hostPort      = 80
        }]
    }])
}

resource "aws_ecs_service" "my_service" {
    name            = "my-ecs-service"
    cluster         = aws_ecs_cluster.my_ecs_cluster.id
    task_definition = aws_ecs_task_definition.my_task.arn
    launch_type     = "FARGATE"
    desired_count   = 1
    network_configuration {
        subnets          = ["subnet-12345678"]
        security_groups  = ["sg-12345678"]
        assign_public_ip = true
    }
}
        </script>
