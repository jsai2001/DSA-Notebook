  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">GitHub Actions › 13. Hands-on: AWS resources from workflows › IAM role and instance profile</p>
      <p>Create a role and attach a managed policy:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create IAM Role
  run: |
    aws iam create-role \
      --role-name my-iam-role \
      --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
    aws iam attach-role-policy \
      --role-name my-iam-role \
      --policy-arn arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        </script>
      </div>
      <p>Attach the role to an EC2 instance through an instance profile:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Attach IAM Role
  run: |
    aws iam create-instance-profile \
      --instance-profile-name my-instance-profile
    aws iam add-role-to-instance-profile \
      --instance-profile-name my-instance-profile \
      --role-name my-iam-role
    aws ec2 associate-iam-instance-profile \
      --instance-id i-1234567890abcdef0 \
      --iam-instance-profile Name=my-instance-profile
        </script>
      </div>
