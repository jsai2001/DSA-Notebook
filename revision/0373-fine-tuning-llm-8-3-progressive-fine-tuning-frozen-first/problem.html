      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
def progressive_fine_tuning(model, train_data, val_data):
    # Phase 1: Train only new layers
    model.compile(optimizer='adam', loss='categorical_crossentropy', metrics=['accuracy'])
    model.fit(train_data, validation_data=val_data, epochs=5)

    # Phase 2: Unfreeze and fine-tune with lower learning rate
    model.layers[0].trainable = True  # Unfreeze base model
    model.compile(
        optimizer=tf.keras.optimizers.Adam(1e-5),  # Lower learning rate
        loss='categorical_crossentropy',
        metrics=['accuracy']
    )
    model.fit(train_data, validation_data=val_data, epochs=3)

    return model
        </script>
      </div>
      <p>Remember to <strong>recompile</strong> after changing <code>trainable</code>.</p>
