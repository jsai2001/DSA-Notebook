    <p class="rev-crumb">Ansible › 4. Playbooks and YAML › Handlers</p>
      <p><strong>Q. What is the <code>handlers</code> section?</strong> Handlers are tasks triggered by <code>notify</code>; they run only when the notifying task reports a change.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Copy config
  copy:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
  notify: Restart Nginx
handlers:
  - name: Restart Nginx
    service:
      name: nginx
      state: restarted
        </script>
