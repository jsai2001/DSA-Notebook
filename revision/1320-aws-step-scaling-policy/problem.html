    <p class="rev-crumb">AWS › 14. Hands-On: Auto Scaling with CloudWatch Alarms › Step scaling policy</p>
      <p>Step 3: save the policy to <code>step-scaling-policy.json</code>.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="JSON">
{
  "AdjustmentType": "ChangeInCapacity",
  "StepAdjustments": [{"MetricIntervalLowerBound": 0, "ScalingAdjustment": 1}],
  "Cooldown": 300
}
        </script>
      </div>
      <p>Then create it and note the <code>PolicyARN</code> from the output.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
aws autoscaling put-scaling-policy \
  --auto-scaling-group-name MyWebServerASG \
  --policy-name MyStepScalingPolicy \
  --policy-type StepScaling \
  --step-scaling-policy-configuration file://step-scaling-policy.json
        </script>
      </div>
