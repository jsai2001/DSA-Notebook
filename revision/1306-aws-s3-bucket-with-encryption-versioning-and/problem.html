    <p class="rev-crumb">AWS › 18. Terraform for AWS: EKS, VPC, S3, RDS and IAM › S3 bucket with encryption, versioning and public access block</p>
      <p><strong>Q. How do you create a secure S3 bucket in Terraform?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Hcl">
resource "aws_s3_bucket" "bucket" { bucket = "my-encrypted-bucket" }
resource "aws_s3_bucket_server_side_encryption_configuration" "encryption" {
  bucket = aws_s3_bucket.bucket.bucket
  rule {
    apply_server_side_encryption_by_default {
      sse_algorithm = "AES256"
    }
  }
}
resource "aws_s3_bucket_versioning" "versioning" {
  bucket = aws_s3_bucket.bucket.bucket
  versioning_configuration {
    status = "Enabled"
  }
}
resource "aws_s3_bucket_public_access_block" "block" {
  bucket                  = aws_s3_bucket.bucket.bucket
  block_public_acls       = true
  block_public_policy     = true
  ignore_public_acls      = true
  restrict_public_buckets = true
}
        </script>
