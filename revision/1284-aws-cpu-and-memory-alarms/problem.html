    <p class="rev-crumb">AWS › 14. Hands-On: Auto Scaling with CloudWatch Alarms › CPU and memory alarms</p>
      <p>Step 4: create alarms that call the scaling policy. CPU alarm at 50%:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
aws cloudwatch put-metric-alarm \
  --alarm-name HighCPUAlarm \
  --metric-name CPUUtilization \
  --namespace AWS/EC2 \
  --statistic Average \
  --period 300 \
  --evaluation-periods 2 \
  --threshold 50 \
  --comparison-operator GreaterThanThreshold \
  --dimensions Name=AutoScalingGroupName,Value=MyWebServerASG \
  --alarm-actions <scaling-policy-arn>
        </script>
      </div>
      <p>Memory alarm at 70% (the CloudWatch agent must push memory metrics, under namespace <code>CWAgent</code>):</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
aws cloudwatch put-metric-alarm \
  --alarm-name HighMemoryAlarm \
  --metric-name MemoryUtilization \
  --namespace CWAgent \
  --statistic Average \
  --period 300 \
  --evaluation-periods 2 \
  --threshold 70 \
  --comparison-operator GreaterThanThreshold \
  --dimensions Name=AutoScalingGroupName,Value=MyWebServerASG \
  --alarm-actions <scaling-policy-arn>
        </script>
      </div>
