    <p class="rev-crumb">AWS CloudWatch › 13. X-Ray Tracing › Tracing DynamoDB calls through boto3</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from aws_xray_sdk.core import xray_recorder
from aws_xray_sdk.ext.boto import patch_all
import boto3

patch_all()

@xray_recorder.capture('scorekeep_function')
def lambda_handler(event, context):
    subsegment = xray_recorder.begin_subsegment('dynamo_operation')
    try:
        dynamodb = boto3.client('dynamodb')
        response = dynamodb.get_item(
            TableName='game',
            Key={'game_id': {'S': event.get('game_id', 'demo')}}
        )
        return {'statusCode': 200, 'body': response.get('Item', {})}
    except Exception as e:
        xray_recorder.record_exception(e)
        raise
    finally:
        xray_recorder.end_subsegment()
        </script>
      </div>
      <p><code>patch_all()</code> makes boto3 calls show up as subsegments in the service map.</p>
