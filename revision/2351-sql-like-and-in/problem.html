    <p class="rev-crumb">SQL › 4. Filtering and Sorting › LIKE and IN</p>
      <p><code>_</code> matches exactly one character. <code>%</code> matches zero, one or many characters. <code>in</code> searches several values.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
select * from customer
where customerlastname like '_r%'

select * from customer
where customerlastname in ('Brown', 'Michael', 'Jim')
        </script>
