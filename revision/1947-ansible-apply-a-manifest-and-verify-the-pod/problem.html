    <section class="q-section rev-sec">
    <p class="rev-crumb">Ansible › 13. Ansible with Kubernetes and GitHub Actions › Apply a manifest and verify the pod</p>
      <p><strong>Q. Ansible to apply a K8s manifest and verify?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Apply K8s
  hosts: localhost
  tasks:
  - name: Apply
    ansible.builtin.command: kubectl apply -f pod.yaml
  - name: Verify
    ansible.builtin.command: kubectl get pod nginx-pod -o jsonpath='{.status.phase}'
    register: pod_status
  - name: Fail if not running
    ansible.builtin.fail: { msg: "Pod not Running" }
    when: pod_status.stdout != "Running"
        </script>
      </div>
      <p><code>pod.yaml</code>:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: v1
kind: Pod
metadata: { name: nginx-pod }
spec: { containers: [{ name: nginx, image: "nginx:latest" }] }
        </script>
      </div>
      <p><strong>Q. Troubleshoot an Ansible-deployed pod that is not running?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
kubectl get pod <pod-name> -n <namespace>
kubectl describe pod <pod-name> -n <namespace>
kubectl logs <pod-name> -n <namespace>
kubectl get pod <pod-name> -n <namespace> -o yaml
        </script>
      </div>
