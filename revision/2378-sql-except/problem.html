    <section class="q-section rev-sec">
    <p class="rev-crumb">SQL › 10. Set Operators (UNION, INTERSECT, EXCEPT) › EXCEPT</p>
      <p>Returns only the records unique to the first table (customer).</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
select cust_lname, cust_fname from customer
except
select cust_lname, cust_fname from customer_2

-- same result with a subquery
select cust_lname, cust_fname from customer
where (cust_lname) not in (select cust_lname from customer_2)
and (cust_fname) not in (select cust_fname from customer_2)
        </script>
