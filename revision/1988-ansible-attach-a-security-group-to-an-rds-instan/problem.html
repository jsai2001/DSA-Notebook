    <p class="rev-crumb">Ansible › 15. Provisioning AWS with Ansible › Attach a security group to an RDS instance</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Attach a security group to an RDS instance
  hosts: localhost
  tasks:
    - name: Modify RDS instance security group
      amazon.aws.rds_instance:
        identifier: "my-rds-instance"
        vpc_security_group_ids: ["sg-12345678"]
        region: "us-east-1"
        apply_immediately: true
        </script>
