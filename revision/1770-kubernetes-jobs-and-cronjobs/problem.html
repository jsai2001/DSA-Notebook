    <p class="rev-crumb">Kubernetes › 14. Manifest Recipes › Jobs and CronJobs</p>
      <p><strong>Q. How do you create a Job?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: batch/v1
kind: Job
metadata:
  name: my-job
spec:
  template:
    spec:
      containers:
      - name: pi
        image: perl
        command: ["perl", "-Mbignum=bpi", "-wle", "print bpi(2000)"]
      restartPolicy: Never
        </script>
      </div>
      <p><strong>Q. How do you create a CronJob that echoes "Hello" every 5 minutes?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cronjob
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: hello
            image: alpine:latest
            command: ["echo", "Hello"]
          restartPolicy: OnFailure
        </script>
      </div>
