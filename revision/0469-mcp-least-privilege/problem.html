    <p class="rev-crumb">Model Context Protocol › 9. Security › Least privilege</p>
      <p>Grant only the minimum access and capabilities.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
# Bad: full file system access, including delete and execute
@server.tool("file-operations")
def file_operations(path: str, action: str):
    if action == "read":
        return open(path).read()
    elif action == "delete":
        os.remove(path)       # too much power
    elif action == "execute":
        os.system(path)       # extremely dangerous
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
# Good: restricted to one directory, read-only
ALLOWED_DIR = "/safe/project/directory"

@server.tool("read-project-file")
def read_project_file(filename: str):
    full_path = os.path.join(ALLOWED_DIR, filename)
    if not full_path.startswith(ALLOWED_DIR):
        return "Access denied: Path outside allowed directory"
    try:
        with open(full_path, 'r') as f:
            return f.read()
    except Exception as e:
        return f"Error: {str(e)}"
        </script>
      </div>
      <p>(The <code>startswith</code> check alone is naive; the next pattern normalizes the path with <code>abspath</code> first.)</p>
