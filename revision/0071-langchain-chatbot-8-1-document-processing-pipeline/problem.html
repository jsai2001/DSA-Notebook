# Text processing and chunking
from langchain.text_splitter import RecursiveCharacterTextSplitter
from langchain.embeddings import OpenAIEmbeddings
from langchain.vectorstores import FAISS

class DocumentProcessor:
    def __init__(self):
        self.text_splitter = RecursiveCharacterTextSplitter(
            chunk_size=1000,
            chunk_overlap=200
        )
        self.embeddings = OpenAIEmbeddings()

    def process_documents(self, texts: List[str]):
        """Process and chunk documents"""
        # Split texts into chunks
        chunks = []
        for text in texts:
            text_chunks = self.text_splitter.split_text(text)
            chunks.extend(text_chunks)
        # Create vector store
        vectorstore = FAISS.from_texts(chunks, self.embeddings)
        return vectorstore

    def create_retriever(self, vectorstore):
        """Create retriever for similarity search"""
        return vectorstore.as_retriever(search_kwargs={"k": 3})

# Usage
processor = DocumentProcessor()
documents = [pdf_text, website_text]  # From previous examples
vectorstore = processor.process_documents(documents)
retriever = processor.create_retriever(vectorstore)
        </script>
