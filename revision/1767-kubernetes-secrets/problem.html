    <p class="rev-crumb">Kubernetes › 14. Manifest Recipes › Secrets</p>
      <p><strong>Q. How do you create a Secret?</strong> Values under <code>data</code> are base64-encoded.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: v1
kind: Secret
metadata:
  name: my-secret
type: Opaque
data:
  username: YWRtaW4=   # base64 for "admin"
  password: cGFzc3dvcmQ=   # base64 for "password"
        </script>
      </div>
      <p><strong>Q. How do you attach a Secret to a Pod?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: v1
kind: Pod
metadata:
  name: my-pod-with-secret
spec:
  containers:
  - name: nginx
    image: nginx
    env:
    - name: USERNAME
      valueFrom:
        secretKeyRef:
          name: my-secret
          key: username
        </script>
      </div>
      <p><strong>Q. How do you create a TLS Secret?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
kubectl create secret tls tls-secret --key tls.key --cert tls.crt
        </script>
      </div>
