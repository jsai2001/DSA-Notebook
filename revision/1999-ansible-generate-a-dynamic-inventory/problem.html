    <p class="rev-crumb">Ansible › 14. Ansible with Python › Generate a dynamic inventory</p>
      <p><strong>Q. Write a Python script to dynamically generate an Ansible inventory file.</strong> Write the host and group information to a file in YAML or INI format.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
import yaml

# Define inventory data
inventory = {
    'webservers': {
        'hosts': ['web1.example.com', 'web2.example.com'],
        'vars': {
            'http_port': 80
        }
    },
    'dbservers': {
        'hosts': ['db1.example.com']
    }
}

# Write to inventory file
with open('inventory.yml', 'w') as f:
    yaml.dump(inventory, f)
        </script>
