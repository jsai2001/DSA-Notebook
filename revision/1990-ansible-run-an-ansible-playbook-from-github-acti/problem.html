      <p><strong>Q. GitHub Actions to run an Ansible playbook on push?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
name: Run Ansible
on: { push: { branches: [main] } }
jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: sudo apt update && sudo apt install -y ansible
    - run: ansible-playbook playbook.yml -i inventory.ini
        </script>
