    <p class="rev-crumb">Ansible › 14. Ansible with Python › Run a playbook with ansible-runner</p>
      <p><strong>Q. How do you run an Ansible playbook programmatically using <code>ansible-runner</code>?</strong> Install it with <code>pip install ansible-runner</code> and use the <code>run</code> function.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
import ansible_runner

# Run an Ansible playbook
r = ansible_runner.run(
    private_data_dir='/path/to/ansible/project',
    playbook='deploy.yml',
    inventory='/path/to/inventory'
)

# Check the result
if r.rc == 0:
    print("Playbook executed successfully")
else:
    print(f"Playbook failed with status: {r.rc}")
        </script>
