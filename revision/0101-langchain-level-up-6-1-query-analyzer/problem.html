      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from langchain_openai import ChatOpenAI
from langchain_core.prompts import ChatPromptTemplate

llm_function_calling = ChatOpenAI(model="gpt-3.5-turbo", temperature=0)
system_message = """You have the ability to issue search queries to get information to help answer user information."""
prompt = ChatPromptTemplate.from_messages([
    ("system", system_message),
    ("human", "{question}"),
])
structured_llm = llm_function_calling.with_structured_output(Search)
query_analyzer = prompt | structured_llm

structured_output = query_analyzer.invoke({"question": "Where did Harrison work?"})
print(structured_output)
# Search(query='work', person='HARRISON')
        </script>
