        <script type="text/plain" data-lang="Python">
def validate_extracted_data(text_content):
    """Validate and prepare extracted data"""
    # Basic validation checks
    if not text_content or len(text_content.strip()) == 0:
        return False, "No content extracted"
    if len(text_content) < 100:
        return False, "Content too short for meaningful chatbot responses"
    # Clean up the text
    cleaned_text = text_content.strip()
    cleaned_text = ' '.join(cleaned_text.split())  # Remove extra whitespace
    return True, cleaned_text

# Usage
with open('pdf_text.txt', 'r', encoding='utf-8') as f:
    raw_text = f.read()
is_valid, processed_text = validate_extracted_data(raw_text)
if is_valid:
    print("Data validation successful")
    # Save cleaned version
    with open('cleaned_data.txt', 'w', encoding='utf-8') as f:
        f.write(processed_text)
else:
    print(f"Data validation failed: {processed_text}")
        </script>
