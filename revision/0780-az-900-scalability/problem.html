    <section class="q-section rev-sec">
    <p class="rev-crumb">AZ-900 › 3. Benefits of cloud: availability, scale, reliability, governance › Scalability</p>
      <p>Horizontal scaling with a VM Scale Set (VMSS), manual and autoscale rules:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
# Create a Virtual Machine Scale Set (VMSS) — auto horizontal scaling
az vmss create \
  --resource-group myRG \
  --name myScaleSet \
  --image Ubuntu2204 \
  --vm-sku Standard_B2s \
  --instance-count 2 \
  --admin-username azureuser \
  --generate-ssh-keys \
  --load-balancer myLoadBalancer

# Scale OUT to 4 instances
az vmss scale \
  --resource-group myRG \
  --name myScaleSet \
  --new-capacity 4

# Scale IN back to 2 instances
az vmss scale \
  --resource-group myRG \
  --name myScaleSet \
  --new-capacity 2

# Enable autoscaling — scale automatically based on CPU usage
az monitor autoscale create \
  --resource-group myRG \
  --resource myScaleSet \
  --resource-type Microsoft.Compute/virtualMachineScaleSets \
  --name myAutoscale \
  --min-count 2 \
  --max-count 10 \
  --count 2

# Add a rule: scale out when CPU > 70%
az monitor autoscale rule create \
  --resource-group myRG \
  --autoscale-name myAutoscale \
  --condition "Percentage CPU > 70 avg 5m" \
  --scale out 2

# Add a rule: scale in when CPU < 30%
az monitor autoscale rule create \
  --resource-group myRG \
  --autoscale-name myAutoscale \
  --condition "Percentage CPU < 30 avg 5m" \
  --scale in 1
        </script>
