    <p class="rev-crumb">AutoGen › 5. Sequential Chats: Research Assistant › Agents</p>
      <p><code>UserProxyAgent</code> represents the human's interests; here with <code>code_execution_config=False</code> (no code to run).</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
import autogen
from autogen import ConversableAgent, UserProxyAgent
import os
from dotenv import load_dotenv

load_dotenv()
llm_config = {"model": "gpt-4o", "api_key": os.getenv("OPENAI_API_KEY")}

manager_proxy = UserProxyAgent(
    name="manager_proxy",
    system_message="""You are a marketing campaign manager. 
    Your role is to:
    - Provide campaign topics
    - Evaluate ideas and scripts generated by the creative team
    - Make final decisions on campaign direction""",
    human_input_mode="NEVER",
    code_execution_config=False,
    llm_config=llm_config
)

idea_generator = ConversableAgent(
    name="idea_generator",
    system_message="""You are a creative idea generator for marketing videos.
    Your responsibilities:
    - Generate innovative campaign ideas based on the given topic
    - Suggest potential storylines
    - Provide a brief outline for each idea
    - Think creatively and generate variety of concepts""",
    llm_config=llm_config,
    human_input_mode="NEVER"
)

script_writer = ConversableAgent(
    name="script_writer",
    system_message="""You are an expert script writer for marketing videos.
    Your role is to:
    - Develop full scripts based on selected ideas
    - Include dialog
    - Include scene descriptions
    - Include camera directions
    - Ensure engaging and professional content""",
    llm_config=llm_config,
    human_input_mode="NEVER"
)

script_reviewer = ConversableAgent(
    name="script_reviewer",
    system_message="""You are a script reviewer for marketing videos.
    Your responsibilities:
    - Analyze completed scripts
    - Provide detailed feedback
    - Evaluate coherence
    - Assess engagement level
    - Check alignment with campaign topic
    - Suggest improvements""",
    llm_config=llm_config,
    human_input_mode="NEVER"
)
        </script>
