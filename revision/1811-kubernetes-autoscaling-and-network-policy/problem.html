    <p class="rev-crumb">Kubernetes › 14. Manifest Recipes › Autoscaling and network policy</p>
      <p><strong>Q. How do you create a HorizontalPodAutoscaler for a Deployment?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
        </script>
      </div>
      <p><strong>Q. How do you create a NetworkPolicy to restrict Pod traffic?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: my-network-policy
spec:
  podSelector:
    matchLabels:
      app: nginx
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 80
        </script>
      </div>
