      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create a security group
  hosts: localhost
  tasks:
    - name: Create security group
      amazon.aws.ec2_security_group:
        name: "my-security-group"
        description: "My security group"
        vpc_id: "vpc-12345678"
        region: "us-east-1"
        rules:
          - proto: tcp
            ports: 22
            cidr_ip: "0.0.0.0/0"
        </script>
