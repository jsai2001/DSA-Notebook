      <p><strong>Q. How do you create a Lambda function with CloudFormation (YAML)?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
Resources:
    MyLambdaFunction:
        Type: AWS::Lambda::Function
        Properties:
            FunctionName: my-lambda-function
            Handler: index.handler
            Runtime: nodejs18.x
            Role: arn:aws:iam::123456789012:role/lambda-exec-role
            Code:
                S3Bucket: my-code-bucket
                S3Key: lambda-code.zip
        </script>
