def custom_debug_analysis(result):
    """Custom debugging analysis"""
    messages = result["messages"]

    print("=== CUSTOM DEBUG ANALYSIS ===")

    # Count message types
    message_counts = {}
    for msg in messages:
        msg_type = type(msg).__name__
        message_counts[msg_type] = message_counts.get(msg_type, 0) + 1

    print(f"Message breakdown: {message_counts}")

    # Extract tool calls
    tool_calls = []
    for msg in messages:
        if hasattr(msg, 'tool_calls') and msg.tool_calls:
            tool_calls.extend(msg.tool_calls)

    print(f"Tools used: {[call.get('name', 'unknown') for call in tool_calls]}")

    # Performance metrics
    print(f"Total steps: {len(messages)}")
    print(f"Final answer: {messages[-1].content}")
