      <p><strong>Q. How do you send Slack, Teams or email notifications by outcome?</strong> Put them in the <code>post</code> block keyed to result conditions, using the Slack, Teams or Email Extension plugins.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Groovy">
post {
  success { slackSend channel: '#ci', color: 'good',   message: "✅ ${env.JOB_NAME} #${env.BUILD_NUMBER}" }
  failure { slackSend channel: '#ci', color: 'danger', message: "❌ ${env.JOB_NAME} #${env.BUILD_NUMBER} ${env.BUILD_URL}" }
}
        </script>
