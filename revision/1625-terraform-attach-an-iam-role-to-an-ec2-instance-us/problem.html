    <p class="rev-crumb">Terraform › 13. Hands-On: Compute, Storage and Databases › Attach an IAM role to an EC2 instance using Terraform</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Hcl">
resource "aws_iam_instance_profile" "my_profile" {
   name = "my-instance-profile"
   role = aws_iam_role.my_role.name
}

resource "aws_instance" "my_ec2_with_role" {
   ami                  = "ami-0c55b159cbfafe1f0"
   instance_type        = "t2.micro"
   subnet_id            = "subnet-12345678"
   iam_instance_profile = aws_iam_instance_profile.my_profile.name
}
        </script>
