      <p>Encoder-decoder (T5, task prefix selects the task):</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from transformers import T5Tokenizer, T5ForConditionalGeneration

# Load T5 model
tokenizer = T5Tokenizer.from_pretrained('t5-small')
model = T5ForConditionalGeneration.from_pretrained('t5-small')

def t5_task(task_prefix, text, max_length=150):
    """Perform various tasks using T5"""
    input_text = f"{task_prefix}: {text}"
    inputs = tokenizer.encode(input_text, return_tensors="pt", 
                             max_length=512, truncation=True)

    with torch.no_grad():
        outputs = model.generate(
            inputs,
            max_length=max_length,
            num_beams=4,
            early_stopping=True
        )

    return tokenizer.decode(outputs[0], skip_special_tokens=True)

# Example usage for different tasks
text = "The quick brown fox jumps over the lazy dog. This is a simple sentence for testing."

# Summarization
summary = t5_task("summarize", text)
print(f"Summary: {summary}")

# Translation (if model supports it)
translation = t5_task("translate English to German", "Hello, how are you?")
print(f"Translation: {translation}")
        </script>
