    <p class="rev-crumb">AWS › 19. Troubleshooting ECR Image Pulls on EKS › Automate ECR token refresh</p>
      <p>ECR tokens expire, so refresh the secret with a script.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
import boto3
import subprocess
import base64

def update_ecr_secret():
    ecr_client = boto3.client('ecr', region_name='<region>')
    token = ecr_client.get_authorization_token()['authorizationData'][0]
    password = base64.b64decode(token['authorizationToken']).decode('utf-8').split(':')[1]
    cmd = f"""kubectl create secret docker-registry ecr-secret \
        --docker-server={token['proxyEndpoint']} \
        --docker-username=AWS \
        --docker-password={password} \
        --namespace <namespace> --dry-run=client -o yaml | kubectl apply -f -"""
    subprocess.run(cmd, shell=True, check=True)

update_ecr_secret()
        </script>
