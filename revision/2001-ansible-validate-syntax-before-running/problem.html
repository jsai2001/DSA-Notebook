    <p class="rev-crumb">Ansible › 14. Ansible with Python › Validate syntax before running</p>
      <p><strong>Q. How do you validate playbook syntax from Python before execution?</strong> Run <code>ansible-playbook --syntax-check</code> through <code>ansible-runner</code> and confirm there are no errors.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
import ansible_runner

# Run syntax check
r = ansible_runner.run(
    private_data_dir='/path/to/ansible/project',
    playbook='deploy.yml',
    cmdline='--syntax-check'
)

if r.rc == 0:
    print("Syntax check passed")
else:
    print(f"Syntax check failed: {r.rc}")
        </script>
