    <section class="q-section rev-sec">
    <p class="rev-crumb">SQL › 12. Ranking Functions › NTILE</p>
      <p><code>NTILE(n)</code> splits the result into n groups and numbers each row by its group.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
SELECT *,
NTILE(3) OVER(ORDER BY Salary DESC) SalaryRank
FROM EmployeeSalary
ORDER BY SalaryRank;

-- with PARTITION BY
SELECT *,
NTILE(3) OVER(PARTITION BY JobTitle ORDER BY Salary DESC) SalaryRank
FROM EmployeeSalary
ORDER BY JobTitle, SalaryRank;
        </script>
      </div>
