      <p><strong>Multi-source RAG as a tool:</strong> several vector stores, one function that queries all and merges labeled results.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
# Advanced RAG agent with multiple data sources
from langchain.vectorstores import Chroma
from langchain.embeddings import OpenAIEmbeddings
from langchain.document_loaders import WebBaseLoader, PDFLoader
from langchain.text_splitter import RecursiveCharacterTextSplitter

class AdvancedRAGAgent:
    def __init__(self):
        self.embeddings = OpenAIEmbeddings()
        self.vectorstores = {}
        self.setup_knowledge_bases()

    def setup_knowledge_bases(self):
        """Setup multiple knowledge bases"""
        # Web content
        web_loader = WebBaseLoader(["https://example.com/docs"])
        web_docs = web_loader.load()

        # PDF documents
        pdf_loader = PDFLoader("company_docs.pdf")
        pdf_docs = pdf_loader.load()

        # Create separate vector stores
        self.vectorstores["web"] = Chroma.from_documents(web_docs, self.embeddings)
        self.vectorstores["docs"] = Chroma.from_documents(pdf_docs, self.embeddings)

    def multi_source_search(self, query: str):
        """Search across multiple knowledge bases"""
        results = {}
        for source, vectorstore in self.vectorstores.items():
            results[source] = vectorstore.similarity_search(query, k=3)
        return results

# Integration with LangGraph
@tool
def advanced_rag_search(query: str) -> str:
    """Search across multiple knowledge bases for comprehensive information"""
    rag_agent = AdvancedRAGAgent()
    results = rag_agent.multi_source_search(query)

    # Combine results from all sources
    combined_context = []
    for source, docs in results.items():
        for doc in docs:
            combined_context.append(f"[{source}] {doc.page_content}")

    return "\n".join(combined_context)
