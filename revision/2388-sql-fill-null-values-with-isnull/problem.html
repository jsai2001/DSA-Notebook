  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">SQL › 13. Worked Examples › Fill NULL values with ISNULL</p>
      <p><code>ISNULL(expression, value)</code> returns <code>value</code> when <code>expression</code> is NULL. When the ParcelID is the same but the UniqueID differs, the property address can be assumed to be the same.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
Select a.ParcelID, a.PropertyAddress, b.ParcelID, b.PropertyAddress,
ISNULL(a.PropertyAddress,b.PropertyAddress)
From NashvilleHousing a
JOIN NashvilleHousing b
on a.ParcelID = b.ParcelID
AND a.[UniqueID] <> b.[UniqueID]
Where a.PropertyAddress is null

-- Update record
Update a
SET PropertyAddress = ISNULL(a.PropertyAddress,b.PropertyAddress)
From NashvilleHousing a
JOIN NashvilleHousing b
on a.ParcelID = b.ParcelID
AND a.[UniqueID] <> b.[UniqueID]
Where a.PropertyAddress is null
        </script>
      </div>
