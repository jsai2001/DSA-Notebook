    <p class="rev-crumb">AWS CloudWatch › 3. Metrics › Reading Lambda errors with get_metric_statistics</p>
      <p>Switch the aggregation from Average to Sum to see the total number of errors over a period.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
cloudwatch = boto3.client('cloudwatch')
response = cloudwatch.get_metric_statistics(
    Namespace='AWS/Lambda',
    MetricName='Errors',
    Dimensions=[{'Name': 'FunctionName', 'Value': 'putItemFunction'}],
    StartTime=datetime.utcnow() - timedelta(minutes=60),
    EndTime=datetime.utcnow(),
    Period=300,
    Statistics=['Sum']
)
print(response['Datapoints'])
        </script>
      </div>
