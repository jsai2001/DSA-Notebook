  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">AWS CloudFormation › 5. First Templates (YAML) › Parameterized instance template</p>
      <p>Hard-coded values become parameters.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
AWSTemplateFormatVersion: 2010-09-09
Description: |
  This template creates a single EC2
  instance with a hard-coded AMI and size!
Parameters:
  MyInstanceType:
    Description: Choose from a few t3 instance types
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
  MyImageId:
    Description: Enter the value of the base AMI for this instance.
    Type: String
    Default: ami-05b10e08d247fb927
Resources:
  MyInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref MyImageId
      InstanceType: !Ref MyInstanceType
        </script>
      </div>
