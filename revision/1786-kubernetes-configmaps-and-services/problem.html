    <p class="rev-crumb">Kubernetes › 17. Kubernetes with Python › ConfigMaps and Services</p>
      <p><strong>Q. How do you create a ConfigMap with the <code>kubernetes</code> client?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from kubernetes import client, config
config.load_kube_config()
v1 = client.CoreV1Api()
config_map = client.V1ConfigMap(
    metadata=client.V1ObjectMeta(name="my-configmap"),
    data={
        "database_url": "mysql://user:pass@localhost:3306/db",
        "log_level": "DEBUG"
    }
)
namespace = "default"
v1.create_namespaced_config_map(namespace=namespace, body=config_map)
print("ConfigMap created successfully")
        </script>
      </div>
      <p><strong>Q. How do you delete a Service with the <code>kubernetes</code> client?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from kubernetes import client, config
config.load_kube_config()
v1 = client.CoreV1Api()
namespace = "default"
service_name = "my-service"
v1.delete_namespaced_service(name=service_name, namespace=namespace)
print(f"Service {service_name} deleted successfully")
        </script>
      </div>
