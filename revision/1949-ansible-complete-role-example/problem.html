    <section class="q-section rev-sec">
    <p class="rev-crumb">Ansible › 8. Roles and Galaxy › Complete role example</p>
      <p>Role layout: <code>defaults/main.yml</code>, <code>tasks/main.yml</code>, <code>templates/nginx.conf.j2</code>, <code>handlers/main.yml</code>.</p>
      <p><code>tasks/main.yml</code>:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Configure nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes
        </script>
      </div>
      <p><code>templates/nginx.conf.j2</code>:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Text">
server {
    listen {{ port }};
    server_name example.com;
    root /var/www/html;
    index index.html;
}
        </script>
      </div>
      <p><code>handlers/main.yml</code>:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Restart nginx
  ansible.builtin.service:
    name: nginx
    state: restarted
        </script>
      </div>
