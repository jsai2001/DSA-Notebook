  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">Ansible › 15. Provisioning AWS with Ansible › Create an EBS volume and attach it to an EC2 instance</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create and attach an EBS volume
  hosts: localhost
  tasks:
    - name: Create EBS volume
      amazon.aws.ec2_vol:
        volume_size: 10
        volume_type: "gp3"
        region: "us-east-1"
        availability_zone: "us-east-1a"
      register: volume
    - name: Attach EBS volume to EC2 instance
      amazon.aws.ec2_vol:
        instance: "i-1234567890abcdef0"
        id: "{{ volume.volume_id }}"
        device_name: "/dev/xvdf"
        region: "us-east-1"
        </script>
      </div>
