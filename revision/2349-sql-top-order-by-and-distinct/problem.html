  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">SQL › 4. Filtering and Sorting › TOP, ORDER BY and DISTINCT</p>
      <p><code>top 2</code> shows the first two rows; <code>top 40 percent</code> also gives two rows here. <code>order by</code> sorts ascending by default. It also accepts column positions. <code>distinct</code> returns unique values only.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
select top 2 * from customer
select top 40 percent * from customer

select customerfirstname, customerlastname from customer
order by customerlastname desc

-- order by column numbers instead of names
select customerfirstname, customerlastname from customer
order by 4, 2, 3 desc

select distinct customerlastname from customer
order by customerlastname
        </script>
      </div>
