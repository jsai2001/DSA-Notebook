from textblob import TextBlob

def analyze_sentiment(text):
    """Analyze sentiment of user input"""
    blob = TextBlob(text)
    polarity = blob.sentiment.polarity
    if polarity > 0.1:
        return "positive"
    elif polarity < -0.1:
        return "negative"
    else:
        return "neutral"

def adapt_response_tone(response, sentiment):
    """Adapt response based on user sentiment"""
    if sentiment == "negative":
        return f"I understand your concern. {response} Is there anything else I can help you with?"
    elif sentiment == "positive":
        return f"{response} I'm glad I could help!"
    else:
        return response

# Enhanced query function
def enhanced_query_llm(question):
    sentiment = analyze_sentiment(question)
    base_response = query_llm(question)
    adapted_response = adapt_response_tone(base_response, sentiment)
    return adapted_response
