    <p class="rev-crumb">RESTful API › 4. Database with SQLAlchemy: Models and Seeding › ORM models</p>
      <p>Models are classes inheriting <code>db.Model</code>, mapped to tables. <code>__tablename__</code> sets the table name, <code>db.Column</code> defines columns. Models can live in one file or be split into modules.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
class User(db.Model):
    __tablename__ = 'users'
    id = db.Column(db.Integer, primary_key=True)
    first_name = db.Column(db.String)
    last_name = db.Column(db.String)
    email = db.Column(db.String, unique=True)
    password = db.Column(db.String)
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
class Planet(db.Model):
    __tablename__ = 'planets'
    planet_id = db.Column(db.Integer, primary_key=True)
    planet_name = db.Column(db.String)
    planet_type = db.Column(db.String)
    home_star = db.Column(db.String)
    mass = db.Column(db.Float)
    radius = db.Column(db.Float)
    distance = db.Column(db.Float)
        </script>
      </div>
