from dataclasses import dataclass
from typing import List

@dataclass
class RAGConfig:
    vector_db_host: str = "localhost"
    vector_db_port: int = 19530
    collection_name: str = "enterprise_docs"
    embedding_model: str = "text-embedding-ada-002"
    llm_model: str = "gpt-3.5-turbo"
    chunk_size: int = 512
    similarity_threshold: float = 0.3

class EnterpriseRAG:
    def __init__(self, config: RAGConfig):
        self.config = config
        self.setup_components()

    def setup_components(self):
        self.vector_store = Milvus(
            embedding_function=OpenAIEmbeddings(model=self.config.embedding_model),
            connection_args={"host": self.config.vector_db_host, "port": self.config.vector_db_port},
            collection_name=self.config.collection_name)
        self.llm = ChatOpenAI(model=self.config.llm_model, temperature=0)

    def query(self, question: str) -> str:
        docs = self.vector_store.similarity_search(question, k=3,
                                                   score_threshold=self.config.similarity_threshold)
        context = "\n".join([doc.page_content for doc in docs])
        prompt = f"Context: {context}\n\nQuestion: {question}\nAnswer:"
        return self.llm.predict(prompt)
        </script>

# Document processing pipeline
from langchain.text_splitter import RecursiveCharacterTextSplitter
from langchain.document_loaders import DirectoryLoader

class DocumentProcessor:
    def __init__(self, chunk_size: int = 512):
        self.splitter = RecursiveCharacterTextSplitter(chunk_size=chunk_size, chunk_overlap=50)

    def process_directory(self, path: str) -> List:
        loader = DirectoryLoader(path, glob="**/*.{pdf,txt,md}")
        return self.splitter.split_documents(loader.load())

    def add_to_vectorstore(self, documents: List, vector_store):
        vector_store.add_documents(documents)
