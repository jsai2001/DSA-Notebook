        <script type="text/plain" data-lang="Python">
@tool
def find_difference(x: int, y: int) -> int:
    """Calculate the difference between two integers (x - y)."""
    return x - y

@tool
def find_quotient(x: int, y: int) -> float:
    """Calculate the quotient of two integers (x / y). Returns error if y is zero."""
    if y == 0:
        return "Error: Division by zero"
    return x / y

# Extended tools
extended_tools = [find_sum, find_product, find_difference, find_quotient]

# Create enhanced agent
enhanced_agent = create_react_agent(
    model=llm,
    tools=extended_tools,
    state_modifier=SystemMessage(content="""
    You are a comprehensive math assistant. Use the provided tools for:
    - Addition: find_sum
    - Multiplication: find_product  
    - Subtraction: find_difference
    - Division: find_quotient
    Always use tools, never calculate directly.
    """)
)
        </script>

@tool
def web_search(query: str) -> str:
    """Search the web for information about the query"""
    # Simplified web search implementation
    return f"Search results for: {query}"

@tool
def calculator(expression: str) -> str:
    """Evaluate mathematical expressions safely"""
    try:
        # Safe evaluation (in production, use proper math parser)
        result = eval(expression)
        return str(result)
    except:
        return "Invalid expression"

# Extended tool set
extended_tools = [find_sum, find_product, web_search, calculator]
