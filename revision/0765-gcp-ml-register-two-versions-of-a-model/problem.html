  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">GCP for Machine Learning › 10. Model Registry › Register two versions of a model</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
# 1. Get pre-trained models from TensorFlow Hub
import tensorflow as tf
import tensorflow_hub as hub
model_v1 = tf.keras.Sequential([
    hub.KerasLayer("https://tfhub.dev/google/imagenet/mobilenet_v2_100_224/classification/5")
])
model_v1.build([None, 224, 224, 3])
model_v1.summary()
# Second version
model_v2 = tf.keras.Sequential([
    hub.KerasLayer("https://tfhub.dev/google/imagenet/mobilenet_v2_130_224/classification/5")
])
model_v2.build([None, 224, 224, 3])
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
# 2. Save artifacts and upload to GCS
model_v1.save("model_v1")
model_v2.save("model_v2")
# !gsutil cp -r model_v1 gs://<your-bucket>/models/model_v1
# !gsutil cp -r model_v2 gs://<your-bucket>/models/model_v2
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
# 3. Upload version 1 (default, with aliases)
model = aip.Model.upload(
    display_name="my-model",
    artifact_uri="gs://<your-bucket>/models/model_v1",
    serving_container_image_uri="us-docker.pkg.dev/vertex-ai/prediction/tf2-cpu.2-12:latest",
    is_default_version=True,
    version_aliases=["v1", "stable"],
    version_description="Initial version"
)
print(f"Model uploaded: {model.resource_name}")
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
# 4. Upload version 2 as a new version of the same model (parent_model)
model_v2_resource = aip.Model.upload(
    display_name="my-model",
    parent_model=model.resource_name,
    artifact_uri="gs://<your-bucket>/models/model_v2",
    serving_container_image_uri="us-docker.pkg.dev/vertex-ai/prediction/tf2-cpu.2-12:latest",
    is_default_version=False,
    version_aliases=["v2", "experimental"],
    version_description="Updated architecture"
)
print(f"Version 2 uploaded: {model_v2_resource.resource_name}")
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
# 5. Manage versions
versions = aip.Model.list(filter=f'display_name="my-model"')
for v in versions:
    print(f"Version: {v.version_id}, Aliases: {v.version_aliases}")
# Change the default version
model_v2_resource.version_aliases = ["v2", "stable", "default"]
# Use the API to update the default version
# List all model resources
all_models = aip.Model.list()
for m in all_models:
    print(f"{m.display_name} — deployed: {bool(m.deployed_models)}")
        </script>
      </div>
