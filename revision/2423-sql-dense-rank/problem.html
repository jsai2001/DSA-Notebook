    <p class="rev-crumb">SQL › 12. Ranking Functions › DENSE_RANK</p>
      <p><code>DENSE_RANK</code> also gives duplicates the same rank, but keeps the sequence with no gap.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
SELECT *,
DENSE_RANK() OVER(ORDER BY Salary DESC) SalaryRank
FROM EmployeeSalary
ORDER BY SalaryRank

SELECT *,
DENSE_RANK() OVER(PARTITION BY JobTitle ORDER BY Salary DESC) SalaryRank
FROM EmployeeSalary
ORDER BY JobTitle, SalaryRank
        </script>
