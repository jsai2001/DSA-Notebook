      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
def peft_inference(model, tokenizer, input_text, task_type="translation"):
    """Perform inference with PEFT model"""

    # Format input based on task
    if task_type == "translation":
        formatted_input = f"translate English to Spanish: {input_text}"
    elif task_type == "summarization":
        formatted_input = f"summarize: {input_text}"
    else:
        formatted_input = input_text

    # Tokenize
    inputs = tokenizer(formatted_input, return_tensors="pt", max_length=512, 
                      truncation=True, padding=True)

    # Generate
    with torch.no_grad():
        outputs = model.generate(**inputs, max_length=150, num_beams=4, 
                                early_stopping=True)

    # Decode
    result = tokenizer.decode(outputs[0], skip_special_tokens=True)
    return result

# Usage
translation = peft_inference(lora_model, tokenizer, "Hello world", "translation")
