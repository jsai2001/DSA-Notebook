    <p class="rev-crumb">Ansible › 13. Ansible with Kubernetes and GitHub Actions › Configure a K8s node with Ansible from GitHub Actions</p>
      <p><strong>Q. GitHub Actions with Ansible to configure a K8s node and verify?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
name: Configure Node
on: { push: { branches: [main] } }
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: sudo apt update && sudo apt install -y ansible
    - run: ansible-playbook -i inventory.ini configure_node.yml
    - uses: azure/setup-kubectl@v3
    - run: echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
    - run: kubectl get nodes
        </script>
      </div>
      <p><code>configure_node.yml</code>:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Configure node
  hosts: k8s_nodes
  become: yes
  tasks:
  - name: Install kubeadm
    ansible.builtin.package: { name: kubeadm, state: present }
        </script>
