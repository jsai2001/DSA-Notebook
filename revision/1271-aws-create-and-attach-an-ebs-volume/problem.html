    <p class="rev-crumb">AWS › 12. Hands-On: Provisioning with the AWS CLI › Create and attach an EBS volume</p>
      <p><strong>Q. How do you create an EBS volume and attach it to an EC2 instance?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
# Create EBS volume
aws ec2 create-volume \
    --availability-zone us-east-1a \
    --size 10 \
    --volume-type gp3 \
    --region us-east-1
# Attach volume to EC2 instance
aws ec2 attach-volume \
    --volume-id vol-1234567890abcdef0 \
    --instance-id i-1234567890abcdef0 \
    --device /dev/xvdf \
    --region us-east-1
        </script>
      </div>
