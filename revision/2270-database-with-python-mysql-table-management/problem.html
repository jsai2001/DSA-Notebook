      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
CREATE TABLE employees (
    id INT AUTO_INCREMENT PRIMARY KEY,
    first_name VARCHAR(50),
    last_name VARCHAR(50),
    email VARCHAR(100) UNIQUE,
    hire_date DATE,
    salary DECIMAL(10, 2)
);
SHOW TABLES;
DESCRIBE employees;            -- or: SHOW COLUMNS FROM employees;
ALTER TABLE employees ADD department_id INT;
ALTER TABLE employees MODIFY COLUMN email VARCHAR(150);
ALTER TABLE employees DROP COLUMN department_id;
ALTER TABLE employees ADD PRIMARY KEY (id);
ALTER TABLE employees ADD CONSTRAINT fk_dept FOREIGN KEY (department_id) REFERENCES departments(department_id);
ALTER TABLE employees DROP FOREIGN KEY fk_dept;
TRUNCATE TABLE employees;      -- remove all rows, keep structure
RENAME TABLE employees TO staff;
DROP TABLE employees;
        </script>

      <p><strong>Q. Which constraints should you know?</strong> PRIMARY KEY, FOREIGN KEY, UNIQUE and NOT NULL, plus the CASCADE options on foreign keys.</p>
