      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from selenium.webdriver.common.action_chains import ActionChains

source = driver.find_element(By.XPATH, '//*[@id="washington"]')
destination = driver.find_element(By.XPATH, '//*[@id="united-states"]')

ActionChains(driver).drag_and_drop(source, destination).perform()
        </script>
