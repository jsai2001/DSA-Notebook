        <script type="text/plain" data-lang="Hcl">
resource "aws_dynamodb_table" "my_dynamodb_table" {
    name           = "my-dynamodb-table"
    billing_mode   = "PAY_PER_REQUEST"
    hash_key       = "id"
    attribute {
        name = "id"
        type = "S"
    }
}
