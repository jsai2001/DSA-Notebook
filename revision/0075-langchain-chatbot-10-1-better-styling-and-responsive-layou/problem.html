        <script type="text/plain" data-lang="CSS">
/* Modern chatbot interface styling */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
}
.chatbot-container {
    max-width: 800px;
    margin: 0 auto;
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    overflow: hidden;
}
.chat-header {
    background: #4a5568;
    color: white;
    padding: 20px;
    text-align: center;
}
#chat-container {
    height: 500px;
    overflow-y: auto;
    padding: 20px;
    background: #f7fafc;
}
.message {
    margin-bottom: 15px;
    padding: 12px 16px;
    border-radius: 18px;
    max-width: 70%;
    word-wrap: break-word;
}
.user {
    background: #4299e1;
    color: white;
    margin-left: auto;
    text-align: right;
}
.bot {
    background: #48bb78;
    color: white;
    margin-right: auto;
}
.input-container {
    display: flex;
    padding: 20px;
    background: white;
    border-top: 1px solid #e2e8f0;
}
#user-input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 25px;
    outline: none;
    font-size: 16px;
}
#send-btn {
    margin-left: 10px;
    padding: 12px 24px;
    background: #4299e1;
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.3s;
}
#send-btn:hover {
    background: #3182ce;
}
        </script>
