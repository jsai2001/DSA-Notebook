  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">Ansible › 9. Advanced Features and Scaling › Fact caching</p>
      <p>Fact caching stores facts so each run skips fact gathering. This example uses Redis.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
sudo apt install redis-server  # On Ubuntu
pip install redis              # Python client for Ansible
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Ini">
[defaults]
fact_caching = redis
fact_caching_timeout = 86400  # Cache for 24 hours
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Test fact caching
  hosts: webservers
  tasks:
    - name: Display a fact
      ansible.builtin.debug:
        msg: "OS family is {{ ansible_os_family }}"
        </script>
      </div>
      <p>Run the playbook twice. The first run gathers and caches the facts; the second reuses them.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook -i inventory.ini fact_caching_example.yml
ansible-playbook -i inventory.ini fact_caching_example.yml
        </script>
      </div>
