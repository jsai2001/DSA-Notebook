        <script type="text/plain" data-lang="SQL">
INSERT INTO employees (first_name, last_name, email, hire_date, salary)
VALUES ('John', 'Doe', 'john.doe@example.com', '2023-01-15', 50000.00);
UPDATE employees SET salary = salary + 5000 WHERE id = 1;
DELETE FROM employees WHERE id = 1;

SELECT first_name, last_name, salary FROM employees WHERE salary > 55000 ORDER BY salary DESC LIMIT 5;

SELECT department_id, COUNT(*) AS emp_count, AVG(salary) AS avg_salary
FROM employees
GROUP BY department_id
HAVING COUNT(*) > 2;

SELECT e.first_name, d.department_name
FROM employees e
LEFT JOIN departments d ON e.department_id = d.department_id;

SELECT first_name
FROM employees
WHERE salary > (SELECT AVG(salary) FROM employees);

SELECT first_name, salary,
       RANK() OVER (PARTITION BY department_id ORDER BY salary DESC) AS rank
FROM employees;
        </script>

      <p>Use WHERE to avoid unintended updates or deletes, and learn joins, CTEs and window functions.</p>
