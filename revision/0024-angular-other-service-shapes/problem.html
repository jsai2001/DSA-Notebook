      <p>Service with signals, injecting another service, doing an HTTP call in the constructor (details in section 14):</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="TypeScript">
@Injectable({ providedIn: 'root' })
export class MessageService {
  public unread = signal<Message[]>([]);

  public count = computed(() => {
    return this.unread().length;
  });

  constructor(
    private analytics: AnalyticsService,
    private http: HttpClient,
  ) {
    effect(() => {
      this.analytics.track('MESSAGE_COUNT', this.count().toString());
    });

    this.http
      .get<Message[]>('/assets/mocks/messages.json')
      .pipe(takeUntilDestroyed())
      .subscribe({
        next: items => this.unread.set(items)
      });
  }

  public delete(selected: Message) {
    this.unread.update(items => {
      return items.filter((item) => item.id !== selected.id);
    });
  }
}
        </script>
      </div>
      <p>Generic shapes:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="TypeScript">
// CRUD API service
@Injectable({ providedIn: 'root' })
export class ApiService {
  constructor(private http: HttpClient) { }
  getAll$()                   { return this.http.get<T[]>(url); }
  getById$(id: string)        { return this.http.get<T>(url); }
  create$(data: T)            { return this.http.post<T>(url, data); }
  update$(id: string, data: T){ return this.http.put<T>(url, data); }
  delete$(id: string)         { return this.http.delete(url); }
}

// State service
@Injectable({ providedIn: 'root' })
export class StateService {
  private state = signal<State>(initialState);
  public readonly state$ = this.state.asReadonly();
  public updateState(newState: State) { this.state.set(newState); }
}
        </script>
