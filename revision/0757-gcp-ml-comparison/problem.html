  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">GCP for Machine Learning › 7. Notebook Types and GPU Scaling › Comparison</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
# New "Instances" type (managed + user-managed features)
gcloud workbench instances create mnist-instance \
  --location=us-central1-a \
  --machine-type=n1-standard-4
# SSH (user-managed feature)
gcloud compute ssh mnist-instance --zone=us-central1-a
# JupyterLab URL
gcloud workbench instances describe mnist-instance \
  --location=us-central1-a \
  --format="value(proxyUri)"
# Dynamically attach a GPU (managed feature)
gcloud workbench instances update mnist-instance \
  --location=us-central1-a \
  --machine-type=n1-standard-8 \
  --accelerator-type=NVIDIA_TESLA_T4 \
  --accelerator-core-count=1
# List, stop (save cost), delete
gcloud workbench instances list --location=us-central1-a --format=table
gcloud workbench instances stop mnist-instance --location=us-central1-a
gcloud workbench instances delete mnist-instance --location=us-central1-a
        </script>
      </div>
