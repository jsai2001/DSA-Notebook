      <p><code>Annotated</code> documents each argument for the LLM; <code>Literal</code> restricts the operator to allowed values.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from typing import Annotated, Literal

def calculator(
    a: Annotated[int, "First number"],
    b: Annotated[int, "Second number"],
    operator: Annotated[Literal["+", "-", "*", "/"], "Operation"]
) -> int:
    if operator == "+":
        return a + b
    elif operator == "-":
        return a - b
    elif operator == "*":
        return a * b
    elif operator == "/":
        return a // b
    raise ValueError("Invalid operator")
        </script>
