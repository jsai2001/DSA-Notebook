    <p class="rev-crumb">AZ-900 › 2. Cloud concepts: models and shared responsibility › Cloud models</p>
      <p>Hybrid connectivity, an Azure VNet plus VPN gateway plus a local gateway for the on-prem side:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
# Hybrid cloud — connect on-prem to Azure via VPN Gateway

# 1. Create a virtual network in Azure
az network vnet create \
  --resource-group myHybridRG \
  --name myAzureVNet \
  --address-prefix 10.0.0.0/16 \
  --subnet-name GatewaySubnet \
  --subnet-prefix 10.0.1.0/24

# 2. Create a VPN gateway (connects Azure to on-prem)
az network vnet-gateway create \
  --resource-group myHybridRG \
  --name myVPNGateway \
  --vnet myAzureVNet \
  --gateway-type Vpn \
  --vpn-type RouteBased \
  --sku VpnGw1

# 3. Create a local network gateway (represents your on-prem network)
az network local-gateway create \
  --resource-group myHybridRG \
  --name myOnPremGateway \
  --gateway-ip-address <your-on-prem-public-ip> \
  --local-address-prefixes 192.168.0.0/24
        </script>
      </div>
