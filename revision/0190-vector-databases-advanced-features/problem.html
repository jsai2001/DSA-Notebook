# Conversation memory on top of RAG
from langchain.memory import ConversationBufferWindowMemory

class ConversationalRAG:
    def __init__(self, rag_system):
        self.rag = rag_system
        self.memory = ConversationBufferWindowMemory(k=5)

    def chat(self, message: str) -> str:
        history = self.memory.chat_memory.messages
        enhanced_query = f"Previous conversation: {history}\nCurrent question: {message}"
        response = self.rag.query(enhanced_query)
        self.memory.chat_memory.add_user_message(message)
        self.memory.chat_memory.add_ai_message(response)
        return response
        </script>

def evaluate_rag_system(rag_system, test_questions, ground_truth):
    scores = []
    for question, expected in zip(test_questions, ground_truth):
        scores.append(calculate_similarity(rag_system.query(question), expected))
    return {"average_score": sum(scores) / len(scores), "total_questions": len(test_questions), "scores": scores}
