    <p class="rev-crumb">AWS › 12. Hands-On: Provisioning with the AWS CLI › Create a VPC with a public subnet</p>
      <p><strong>Q. How do you create a VPC with a public subnet using the AWS CLI?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
# Create VPC
aws ec2 create-vpc \
    --cidr-block 10.0.0.0/16 \
    --region us-east-1
# Create subnet
aws ec2 create-subnet \
    --vpc-id vpc-12345678 \
    --cidr-block 10.0.1.0/24 \
    --availability-zone us-east-1a \
    --region us-east-1
# Create internet gateway
aws ec2 create-internet-gateway \
    --region us-east-1
# Attach internet gateway to VPC
aws ec2 attach-internet-gateway \
    --internet-gateway-id igw-12345678 \
    --vpc-id vpc-12345678 \
    --region us-east-1
# Create route table
aws ec2 create-route-table \
    --vpc-id vpc-12345678 \
    --region us-east-1
# Add route to internet gateway
aws ec2 create-route \
    --route-table-id rtb-12345678 \
    --destination-cidr-block 0.0.0.0/0 \
    --gateway-id igw-12345678 \
    --region us-east-1
# Associate route table with subnet
aws ec2 associate-route-table \
    --route-table-id rtb-12345678 \
    --subnet-id subnet-12345678 \
    --region us-east-1
        </script>
      </div>
