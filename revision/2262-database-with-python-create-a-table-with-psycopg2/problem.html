    <p class="rev-crumb">Database with Python › 5. PostgreSQL with Python › Create a table with psycopg2</p>
      <p>Create a virtual environment, install <code>psycopg2-binary</code>, and run the script. There is no console output. Verify in <code>psql</code> with <code>\c red30</code> and <code>\dt</code>.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
python3 -m venv venv
source venv/bin/activate
pip install psycopg2-binary
python3 database.py
deactivate
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
import psycopg2

conn = psycopg2.connect(
    dbname="red30",
    user="root_user",           # replace with your root user
    password="your_password",   # replace with your password
    host="localhost",
    port="5432"
)
cursor = conn.cursor()
cursor.execute("""
    CREATE TABLE sales (
        id SERIAL PRIMARY KEY,
        product VARCHAR(100),
        order_total FLOAT
    );
""")
conn.commit()
cursor.close()
conn.close()
        </script>
