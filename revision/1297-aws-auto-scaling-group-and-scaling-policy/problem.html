    <p class="rev-crumb">AWS › 17. Terraform for AWS: Scaling and Load Balancing › Auto Scaling group and scaling policy</p>
      <p>The Auto Scaling group uses the template and registers instances with the ALB target group.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Hcl">
resource "aws_autoscaling_group" "web_asg" {
  desired_capacity     = 2
  max_size             = 4
  min_size             = 1
  vpc_zone_identifier  = [aws_subnet.public1.id, aws_subnet.public2.id]
  launch_template {
    id      = aws_launch_template.web_template.id
    version = "$Latest"
  }
  target_group_arns = [aws_lb_target_group.web_tg.arn]
}
resource "aws_autoscaling_policy" "scale_out" {
  name                   = "scale-out"
  scaling_adjustment     = 1
  adjustment_type        = "ChangeInCapacity"
  cooldown               = 300
  autoscaling_group_name = aws_autoscaling_group.web_asg.name
}
        </script>
      </div>
