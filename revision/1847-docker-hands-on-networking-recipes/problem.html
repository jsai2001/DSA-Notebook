    <p class="rev-crumb">Docker › 4. Docker Networking › Hands-on networking recipes</p>
      <p><strong>Q. How do you create a Docker network for two containers?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
docker network create my-network
docker run -d --name container1 --network my-network nginx
docker run -d --name container2 --network my-network busybox
        </script>
      </div>
      <p><strong>Q. How do you attach a container to a custom network?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
docker network create custom-network
docker run -d --network custom-network nginx
        </script>
      </div>
      <p><strong>Q. How do you link a container to another container?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
docker run -d --name db mysql:5.7
docker run -d --link db:database nginx
        </script>
      </div>
