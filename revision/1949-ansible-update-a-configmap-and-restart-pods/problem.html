    <p class="rev-crumb">Ansible › 13. Ansible with Kubernetes and GitHub Actions › Update a ConfigMap and restart pods</p>
      <p><strong>Q. Ansible to update a ConfigMap and restart pods?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Update ConfigMap
  hosts: localhost
  tasks:
  - name: Apply
    ansible.builtin.command: kubectl apply -f configmap.yaml
  - name: Restart
    ansible.builtin.command: kubectl rollout restart deployment web-app -n default
        </script>
      </div>
      <p><code>configmap.yaml</code>:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: v1
kind: ConfigMap
metadata: { name: app-config }
data: { env: "production" }
        </script>
      </div>
