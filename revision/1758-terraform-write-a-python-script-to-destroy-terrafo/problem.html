    <p class="rev-crumb">Terraform › 21. Terraform with Python › Write a Python script to destroy Terraform-managed resources using python-terraform.</p>
      <p>Use the <code>destroy</code> method to remove resources.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from python_terraform import Terraform

# Initialize Terraform
tf = Terraform(working_dir='/path/to/terraform/project')

# Run Terraform destroy
return_code, stdout, stderr = tf.destroy(auto_approve=True)
if return_code == 0:
    print("Resources destroyed successfully")
else:
    print(f"Destroy failed: {stderr}")
        </script>
