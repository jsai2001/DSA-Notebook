  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">AWS CloudWatch › 13. X-Ray Tracing › Enabling tracing in a Lambda template</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
Resources:
  ScorekeepLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ScorekeepFunction
      Handler: index.handler
      Runtime: python3.8
      Code:
        S3Bucket: my-bucket
        S3Key: scorekeep.zip
      Role: !GetAtt LambdaExecutionRole.Arn
      TracingConfig:
        Mode: Active
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        </script>
      </div>
      <p><code>TracingConfig: Mode: Active</code> turns on X-Ray tracing for the function.</p>
