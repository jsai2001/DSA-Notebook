    <p class="rev-crumb">Docker › 7. Docker Swarm › Creating and scaling services</p>
      <p><strong>Q. How do you initialize Swarm?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
docker swarm init
        </script>
      </div>
      <p><strong>Q. How do you deploy a Swarm service?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
docker service create --name web -p 80:80 nginx
        </script>
      </div>
      <p><strong>Q. What is a stack in Swarm?</strong> A multi-service YAML file.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
docker stack deploy -c stack.yml mystack
        </script>
      </div>
      <p><strong>Q. How do you scale in Swarm?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
docker service scale web=5
        </script>
      </div>
