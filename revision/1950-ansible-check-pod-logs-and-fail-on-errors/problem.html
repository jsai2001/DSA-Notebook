    <p class="rev-crumb">Ansible › 13. Ansible with Kubernetes and GitHub Actions › Check pod logs and fail on errors</p>
      <p><strong>Q. Ansible task to check pod logs and fail on errors?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Check logs
  hosts: localhost
  tasks:
  - name: Get logs
    ansible.builtin.command: kubectl logs <pod-name> -n <namespace>
    register: pod_logs
  - name: Fail on error
    ansible.builtin.fail: { msg: "Errors in logs" }
    when: "'error' in pod_logs.stdout | lower"
        </script>
