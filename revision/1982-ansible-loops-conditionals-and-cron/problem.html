    <p class="rev-crumb">Ansible › 12. On-Call Ansible Tasks › Loops, conditionals and cron</p>
      <p><strong>Q. Loop over a package list?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Install packages
  hosts: all
  become: yes
  vars: { packages: [nginx, git, curl] }
  tasks:
  - name: Install
    ansible.builtin.package: { name: "{{ item }}", state: present }
    loop: "{{ packages }}"
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook install_packages.yml
        </script>
      </div>
      <p><strong>Q. Run a task only on Debian?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Debian task
  hosts: all
  tasks:
  - name: Update cache
    ansible.builtin.apt: { update_cache: yes }
    when: ansible_os_family == "Debian"
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook debian_task.yml
        </script>
      </div>
      <p><strong>Q. Playbook for a daily cron job at midnight?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Setup cron
  hosts: all
  become: yes
  tasks:
  - name: Create cron
    ansible.builtin.cron: { name: "Daily backup", minute: "0", hour: "0", job: "/usr/local/bin/backup.sh" }
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook cron_backup.yml
        </script>
      </div>
