    <p class="rev-crumb">Advanced RAG › 9. Image Search Demos › Get semantic vectors (OpenCLIP via LangChain)</p>
      <p><code>embed_image</code> takes a <strong>list of image paths/URIs</strong>, not a single image. OpenCLIP gives <strong>1024</strong> dimensions.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from langchain_community.embeddings import OpenCLIPEmbeddings
import glob

image_paths = glob.glob("images/*.jpg")
clip_embeddings = OpenCLIPEmbeddings()
embeddings = clip_embeddings.embed_image(image_paths)

print(f"Number of images: {len(embeddings)}")
print(f"Embedding dimensionality: {len(embeddings[0])}")  # 1024
print(f"Sample embedding (first 5 values): {embeddings[0][:5]}")
        </script>
