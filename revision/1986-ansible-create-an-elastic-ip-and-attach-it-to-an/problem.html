    <section class="q-section rev-sec">
    <p class="rev-crumb">Ansible › 15. Provisioning AWS with Ansible › Create an Elastic IP and attach it to an EC2 instance</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create and attach an Elastic IP
  hosts: localhost
  tasks:
    - name: Allocate Elastic IP
      amazon.aws.ec2_eip:
        region: "us-east-1"
        in_vpc: true
      register: eip
    - name: Associate Elastic IP with EC2 instance
      amazon.aws.ec2_eip:
        instance_id: "i-1234567890abcdef0"
        public_ip: "{{ eip.public_ip }}"
        region: "us-east-1"
        </script>
