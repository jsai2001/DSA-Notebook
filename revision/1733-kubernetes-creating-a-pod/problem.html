    <p class="rev-crumb">Kubernetes › 3. Pods and Workloads › Creating a Pod</p>
      <p><strong>Q. How do you create a Pod in Kubernetes?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
spec:
  containers:
  - name: nginx
    image: nginx:latest
    ports:
    - containerPort: 80
        </script>
      </div>
      <p>Apply it with <code>kubectl apply -f pod.yaml</code>, or run it directly with <code>kubectl run my-pod --image=nginx --restart=Never</code>.</p>
