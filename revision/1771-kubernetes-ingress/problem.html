    <section class="q-section rev-sec">
    <p class="rev-crumb">Kubernetes › 14. Manifest Recipes › Ingress</p>
      <p><strong>Q. How do you create an Ingress resource?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
spec:
  rules:
  - host: example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-service
            port:
              number: 80
        </script>
      </div>
      <p><strong>Q. How do you route <code>/api</code> to a service with an Ingress?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 8080
        </script>
      </div>
      <p><strong>Q. How do you configure an Ingress with TLS?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-tls
spec:
  tls:
  - hosts:
    - example.com
    secretName: tls-secret
  rules:
  - host: example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80
        </script>
      </div>
