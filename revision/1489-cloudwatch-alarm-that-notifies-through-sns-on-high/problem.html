    <p class="rev-crumb">AWS CloudWatch › 11. Alarms › Alarm that notifies through SNS on high CPU</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
cloudwatch.put_metric_alarm(
    AlarmName='HighCPUUtilization',
    ComparisonOperator='GreaterThanThreshold',
    EvaluationPeriods=2,
    MetricName='CPUUtilization',
    Namespace='AWS/EC2',
    Period=300,
    Statistic='Average',
    Threshold=70.0,
    ActionsEnabled=True,
    AlarmActions=['arn:aws:sns:us-east-1:123456789012:MyTopic'],
    AlarmDescription='Alarm when CPU exceeds 70% for 10 minutes',
    Dimensions=[{'Name': 'AutoScalingGroupName', 'Value': 'my-auto-scaling-group'}]
)
        </script>
      </div>
      <p>Two 5-minute periods above 70% means 10 minutes of sustained load. Common actions: SNS notifications and Auto Scaling policies.</p>
