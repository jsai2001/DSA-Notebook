      <p><strong>Q. How do you implement a stack?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
class Stack:
    def __init__(self):
        self.s = []

    def push(self, x):
        self.s.append(x)

    def pop(self):
        return self.s.pop() if self.s else None

s = Stack()
s.push(1)
print(s.pop())  # 1
        </script>

      <p><strong>Q. How do you implement a queue?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from collections import deque

class Queue:
    def __init__(self):
        self.q = deque()

    def enqueue(self, x):
        self.q.append(x)

    def dequeue(self):
        return self.q.popleft() if self.q else None

q = Queue()
q.enqueue(1)
print(q.dequeue())  # 1
        </script>
