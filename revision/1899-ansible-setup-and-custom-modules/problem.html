    <p class="rev-crumb">Ansible › 6. Modules › setup and custom modules</p>
      <p><strong>Q. What is the <code>setup</code> module?</strong> It gathers facts. It runs automatically unless <code>gather_facts: no</code>.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- setup:
        </script>
      </div>
      <p><strong>Q. Write a custom module?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from ansible.module_utils.basic import AnsibleModule
def main():
    module = AnsibleModule(argument_spec=dict(name=dict(type='str', required=True)))
    module.exit_json(changed=True, msg=f"Hello, {module.params['name']}")
if __name__ == '__main__':
    main()
        </script>
      </div>
      <p>Use it in a playbook:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- my_custom_module:
    name: "world"
        </script>
      </div>
