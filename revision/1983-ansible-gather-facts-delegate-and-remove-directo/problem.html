  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">Ansible › 12. On-Call Ansible Tasks › Gather facts, delegate and remove directories</p>
      <p><strong>Q. Gather facts and save them to a file?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible all -m setup -a "gather_subset=all" --tree /tmp/facts
        </script>
      </div>
      <p><strong>Q. Delegate a task to localhost?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Delegate to localhost
  hosts: all
  tasks:
  - name: Run locally
    ansible.builtin.command: "echo {{ inventory_hostname }} >> /tmp/host_list"
    delegate_to: localhost
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook delegate_task.yml
        </script>
      </div>
      <p><strong>Q. Playbook to remove <code>/tmp/old_data</code>?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Remove directory
  hosts: all
  become: yes
  tasks:
  - name: Remove
    ansible.builtin.file: { path: /tmp/old_data, state: absent }
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook remove_dir.yml
        </script>
      </div>
