    <p class="rev-crumb">SQL › 6. Expressions and Functions › CAST and CONVERT</p>
      <p>Both change a data type for use in the query only.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
-- CAST(expression AS datatype(length))
SELECT CAST('2017-08-25 00:00:00.000' AS date)
-- CONVERT(data_type(length), expression, style)
SELECT CONVERT(date,'2017-08-25 00:00:00.000')
        </script>
