import requests

base_url = "https://api.upcitemdb.com/prod/trial/lookup"
parameters = {"upc": "025000044908"}   # query parameters as a dict

response = requests.get(base_url, params=parameters)
print(response.url)    # https://api.upcitemdb.com/prod/trial/lookup?upc=025000044908
print(response.text)   # raw response body
