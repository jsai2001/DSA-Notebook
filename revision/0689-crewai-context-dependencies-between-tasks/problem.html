    <p class="rev-crumb">CrewAI › 8. Tasks › context: dependencies between tasks</p>
      <p>In sequential mode only the immediately preceding task's output flows forward. <code>context</code> takes a list of tasks and pulls output from several tasks or from a non-adjacent one.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
# Depends on multiple tasks (without context it would only get orange_task)
comparison_task = Task(
    description="Compare apples and oranges.",
    expected_output="A comparison report.",
    agent=analyst,
    context=[apple_task, orange_task]
)

# Depends on a non-adjacent task (task_a, task_b, task_c precede it; skips task_c)
task_d = Task(
    description="...",
    expected_output="...",
    agent=agent4,
    context=[task_b]
)
        </script>
      </div>
