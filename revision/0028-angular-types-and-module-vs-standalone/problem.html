    <p class="rev-crumb">Angular › 9. Directives › Types and module vs standalone</p>
      <ul>
        <li><strong>Attribute directives</strong> change appearance or behavior (<code>[appOnlineStatus]</code>). <strong>Structural directives</strong> add or remove elements (<code>*ngIf</code>, <code>*ngFor</code>).</li>
      </ul>
      <div class="code-tabs">
        <script type="text/plain" data-lang="TypeScript">
// module-based
@Directive({ selector: '[appOnlineStatus]', standalone: false })
@NgModule({ declarations: [OnlineStatusDirective], exports: [OnlineStatusDirective] })

// standalone
@Directive({ selector: '[appOnlineStatus]', standalone: true })
@Component({ imports: [OnlineStatusDirective] })
        </script>
      </div>
