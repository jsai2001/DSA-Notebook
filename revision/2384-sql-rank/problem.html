    <section class="q-section rev-sec">
    <p class="rev-crumb">SQL › 12. Ranking Functions › RANK</p>
      <p><code>RANK</code> gives the same rank to rows with similar values, then skips the next rank. <code>PARTITION BY</code> ranks each group separately.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
-- without PARTITION BY
SELECT *,
RANK() OVER(ORDER BY Salary DESC) SalaryRank
FROM EmployeeSalary
ORDER BY SalaryRank

-- with PARTITION BY
SELECT *,
RANK() OVER(PARTITION BY JobTitle ORDER BY Salary DESC) SalaryRank
FROM EmployeeSalary
ORDER BY JobTitle, SalaryRank
        </script>
      </div>
