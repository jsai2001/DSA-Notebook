  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">Ansible › 3. Inventory › Defining and grouping hosts</p>
      <p><strong>Q. Define a static inventory / group hosts?</strong></p>
      <p>INI:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Ini">
[webservers]
web1.example.com
[dbservers]
db1.example.com
        </script>
      </div>
      <p>YAML:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
all:
  children:
    webservers:
      hosts:
        web1.example.com:
        </script>
      </div>
      <p>Use with <code>-i hosts</code>, and target groups in playbooks (<code>hosts: webservers</code>).</p>
      <p>A fuller INI inventory with two hosts per group:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Ini">
[webservers]
web1.example.com ansible_host=192.168.1.10
web2.example.com ansible_host=192.168.1.11
[dbservers]
db1.example.com ansible_host=192.168.1.20
db2.example.com ansible_host=192.168.1.21
        </script>
      </div>
