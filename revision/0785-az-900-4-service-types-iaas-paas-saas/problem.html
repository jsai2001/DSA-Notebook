      <p>IaaS via the Python SDK:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
# Python SDK — create a VM (IaaS)
from azure.identity import DefaultAzureCredential
from azure.mgmt.compute import ComputeManagementClient
from azure.mgmt.compute.models import (
    HardwareProfile, StorageProfile, OSProfile,
    NetworkProfile, VirtualMachine
)

credential = DefaultAzureCredential()
compute = ComputeManagementClient(credential, "<subscription-id>")

vm_params = VirtualMachine(
    location="eastus",
    hardware_profile=HardwareProfile(vm_size="Standard_B2s"),
    storage_profile=StorageProfile(
        image_reference={
            "publisher": "Canonical",
            "offer": "0001-com-ubuntu-server-jammy",
            "sku": "22_04-lts",
            "version": "latest"
        }
    ),
    os_profile=OSProfile(
        computer_name="myIaaSVM",
        admin_username="azureuser",
    ),
    network_profile=NetworkProfile(network_interfaces=[{
        "id": "<nic-id>"
    }])
)

compute.virtual_machines.begin_create_or_update("myIaaSRG", "myIaaSVM", vm_params)
        </script>
      </div>
      <p>PaaS (App Service): no OS management, and turnkey autoscale, custom domain, SSL and CI from GitHub.</p>
