      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
import torchviz
from torchviz import make_dot

a = torch.tensor(2.0, requires_grad=True)
b = torch.tensor(3.0, requires_grad=True)
x = a * b        # 6
y = x + b        # 9
z = y ** 2       # 81
z.backward()

torch.set_printoptions(precision=2)
print("dz/da =", a.grad)   # 2*y * b = 54
print("dz/db =", b.grad)   # 2*y * (1 + a) = 72

# needs graphviz installed (e.g. Homebrew)
make_dot(z, params={"a": a, "b": b}).render("autograd_graph", format="png")
        </script>
