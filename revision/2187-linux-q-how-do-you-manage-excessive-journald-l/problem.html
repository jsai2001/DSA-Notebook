    <p class="rev-crumb">Linux › 7. On-Call: Disk, Inodes and I/O › Q. How do you manage excessive journald logs?</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
journalctl --disk-usage
journalctl --vacuum-size=500M
sudo vi /etc/systemd/journald.conf
# Set: SystemMaxUse=500M
sudo systemctl restart systemd-journald
        </script>
      </div>
      <p>Balance retention against size and monitor after the change.</p>
