    <p class="rev-crumb">AWS Lambda › 13. On-call troubleshooting › Function not processing SQS events</p>
      <p><strong>Symptom: function not processing SQS queue events.</strong> Verify the SQS trigger, permissions (<code>sqs:ReceiveMessage</code>) and the queue visibility timeout.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
aws lambda list-event-source-mappings --function-name <function-name>
aws lambda get-policy --function-name <function-name>
aws sqs get-queue-attributes --queue-url <queue-url> --attribute-names VisibilityTimeout
        </script>
      </div>
