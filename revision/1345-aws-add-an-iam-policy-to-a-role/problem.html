    <section class="q-section rev-sec">
    <p class="rev-crumb">AWS › 18. Terraform for AWS: EKS, VPC, S3, RDS and IAM › Add an IAM policy to a role</p>
      <p><strong>Q. How do you add an IAM policy to a role in Terraform?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Hcl">
resource "aws_iam_role" "existing_role" {
  name = "my-role"
  assume_role_policy = jsonencode({
    Version = "2012-10-17"
    Statement = [{
      Action = "sts:AssumeRole"
      Effect = "Allow"
      Principal = { Service = "ec2.amazonaws.com" }
    }]
  })
}
resource "aws_iam_policy" "new_policy" {
  name = "new-policy"
  policy = jsonencode({
    Version = "2012-10-17"
    Statement = [{
      Action = "s3:GetObject"
      Effect = "Allow"
      Resource = "arn:aws:s3:::my-bucket/*"
    }]
  })
}
resource "aws_iam_role_policy_attachment" "attach" {
  role       = aws_iam_role.existing_role.name
  policy_arn = aws_iam_policy.new_policy.arn
}
        </script>
      </div>
