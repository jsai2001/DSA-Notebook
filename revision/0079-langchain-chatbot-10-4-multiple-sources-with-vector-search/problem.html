      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from langchain.document_loaders import PyPDFLoader, WebBaseLoader
from langchain.text_splitter import RecursiveCharacterTextSplitter
from langchain.vectorstores import FAISS
from langchain.embeddings import OpenAIEmbeddings

class MultiSourceChatbot:
    def __init__(self):
        self.embeddings = OpenAIEmbeddings()
        self.vectorstore = None
        self.setup_knowledge_base()

    def setup_knowledge_base(self):
        """Load and process multiple data sources"""
        documents = []

        # Load PDF documents
        pdf_loader = PyPDFLoader("Landon-Hotel.pdf")
        documents.extend(pdf_loader.load())

        # Load website content
        web_loader = WebBaseLoader(["https://www.landonhotel.com"])
        documents.extend(web_loader.load())

        # Split documents
        text_splitter = RecursiveCharacterTextSplitter(
            chunk_size=1000,
            chunk_overlap=200
        )
        splits = text_splitter.split_documents(documents)

        # Create vector store
        self.vectorstore = FAISS.from_documents(splits, self.embeddings)

    def get_relevant_context(self, question, k=3):
        """Retrieve relevant context for question"""
        if self.vectorstore:
            docs = self.vectorstore.similarity_search(question, k=k)
            return "\n".join([doc.page_content for doc in docs])
        return ""

    def generate_response(self, question):
        """Generate response with relevant context"""
        context = self.get_relevant_context(question)
        prompt = f"""
        Context: {context}
        You are Mr. Landon, hotel manager of Landon Hotel.
        Answer based on the context provided.
        If the question is not about Landon Hotel, say "I can't assist you with that, sorry!"

        Question: {question}
        Answer:"""
        llm = OpenAI(temperature=0)
        return llm(prompt)
        </script>
