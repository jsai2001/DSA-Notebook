      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
# Reads files for all dates; can read one date at a time by appending the date directory to the path
global_stock_df = global_spark.read.parquet("raw_data/")

# Temp view for Spark SQL
global_stock_df.createOrReplaceTempView("GLOBAL_STOCK")

summary_df = global_spark.sql("""
                    SELECT STOCK_DATE, ITEM_NAME,
                            COUNT(*) as TOTAL_REC,
                            SUM(OPENING_STOCK) as OPENING_STOCK,
                            SUM(RECEIPTS) as RECEIPTS,
                            SUM(ISSUES) as ISSUES,
                            SUM( OPENING_STOCK + RECEIPTS - ISSUES) as CLOSING_STOCK,
                            SUM( (OPENING_STOCK + RECEIPTS - ISSUES) * UNIT_VALUE ) as CLOSING_VALUE
                            FROM GLOBAL_STOCK
                            GROUP BY STOCK_DATE, ITEM_NAME
                        """)
summary_df.show(5)

# Write summary to MariaDB
summary_df.write\
    .mode("append")\
    .format("jdbc")\
    .option("url", "jdbc:mysql://localhost:3306/global_stock")\
    .option("dbtable", "global_stock.item_stock")\
    .option("user", "spark")\
    .option("password", "spark")\
    .save()
# Pruning: after processing is over, delete the files in raw_data
        </script>
