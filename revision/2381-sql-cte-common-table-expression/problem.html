    <p class="rev-crumb">SQL › 11. Views, Temp Tables, CTEs and Table Copies › CTE (Common Table Expression)</p>
      <p>A CTE is a temporary result set used to handle complex subqueries. It is created in memory, not in Tempdb, so no index can be created on it.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
WITH CTE_Employee AS
(
SELECT FirstName, LastName, Gender, Salary,
COUNT(Gender) OVER (PARTITION BY Gender) AS TotalGender
FROM EmployeeDemographics ED
JOIN EmployeeSalary ES
ON ED.EmployeeID = ES.EmployeeID
WHERE Salary > '45000'
)
SELECT FirstName, LastName, Gender, TotalGender
FROM CTE_Employee
WHERE TotalGender = (SELECT MIN(TotalGender) FROM CTE_Employee)
        </script>
      </div>
