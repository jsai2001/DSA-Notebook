# External API integration tools
import requests
from typing import Dict, Any

@tool
def weather_api_tool(location: str) -> str:
    """Get current weather information for a location"""
    api_key = "your-weather-api-key"
    url = f"http://api.openweathermap.org/data/2.5/weather?q={location}&appid={api_key}"

    response = requests.get(url)
    if response.status_code == 200:
        data = response.json()
        return f"Weather in {location}: {data['weather'][0]['description']}, {data['main']['temp']}K"
    return f"Could not fetch weather for {location}"

@tool
def slack_notification_tool(message: str, channel: str) -> str:
    """Send notification to Slack channel"""
    webhook_url = "your-slack-webhook-url"
    payload = {
        "channel": channel,
        "text": message,
        "username": "AI Agent"
    }

    response = requests.post(webhook_url, json=payload)
    return "Message sent successfully" if response.status_code == 200 else "Failed to send message"

@tool
def database_query_tool(query: str) -> str:
    """Execute database queries safely"""
    import sqlite3

    # Safe query execution with parameterization
    conn = sqlite3.connect("company_data.db")
    cursor = conn.cursor()

    try:
        # Only allow SELECT queries for safety
        if query.strip().upper().startswith("SELECT"):
            cursor.execute(query)
            results = cursor.fetchall()
            return str(results)
        else:
            return "Only SELECT queries are allowed"
    except Exception as e:
        return f"Query error: {str(e)}"
    finally:
        conn.close()
