import json
from datetime import datetime

class ChatbotAnalytics:
    def __init__(self):
        self.analytics_file = "chatbot_analytics.json"
        self.load_analytics()

    def load_analytics(self):
        """Load existing analytics data"""
        try:
            with open(self.analytics_file, 'r') as f:
                self.data = json.load(f)
        except FileNotFoundError:
            self.data = {
                "total_conversations": 0,
                "common_questions": {},
                "user_satisfaction": []
            }

    def log_interaction(self, question, response, response_time):
        """Log user interaction"""
        self.data["total_conversations"] += 1

        # Track common questions
        if question in self.data["common_questions"]:
            self.data["common_questions"][question] += 1
        else:
            self.data["common_questions"][question] = 1

        # Save analytics
        with open(self.analytics_file, 'w') as f:
            json.dump(self.data, f, indent=2)

    def get_analytics_summary(self):
        """Get analytics summary"""
        return {
            "total_conversations": self.data["total_conversations"],
            "top_questions": sorted(
                self.data["common_questions"].items(),
                key=lambda x: x[1],
                reverse=True
            )[:5]
        }

# Integration with Flask
