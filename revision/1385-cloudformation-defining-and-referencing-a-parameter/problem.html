      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
Parameters:
  MyImageId:
    Description: Enter the value of the base AMI for this instance.
    Type: String
        </script>
      </div>
      <p>Reference it from Resources with <code>!Ref</code>.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
Resources:
  MyInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref MyImageId
        </script>
