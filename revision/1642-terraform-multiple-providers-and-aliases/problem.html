  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">Terraform › 6. Providers › Multiple providers and aliases</p>
      <p><strong>Q. How do you configure multiple providers?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Hcl">
provider "aws" { 
    region = "us-east-1" 
}
provider "aws" { 
    alias = "west" 
    region = "us-west-2" 
}
        </script>
      </div>
      <p><strong>Q. What is provider aliasing?</strong> It names provider variants, for example for multiple regions.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Hcl">
resource "aws_instance" "west" { 
    provider = aws.west 
}
        </script>
      </div>
