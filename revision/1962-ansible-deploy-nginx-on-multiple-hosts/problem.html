        <script type="text/plain" data-lang="YAML">
- name: Deploy Nginx
  hosts: webservers
  become: yes
  tasks:
    - apt:
        name: nginx
        state: present
    - service:
        name: nginx
        state: started
  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
