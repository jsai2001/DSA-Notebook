    <p class="rev-crumb">Ansible › 13. Ansible with Kubernetes and GitHub Actions › Install kubectl and check the cluster</p>
      <p><strong>Q. Ansible to install <code>kubectl</code> and check the cluster?</strong> The <code>creates</code> argument keeps the install step idempotent.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Install kubectl
  hosts: all
  become: yes
  tasks:
  - name: Install
    ansible.builtin.shell: |
      curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      chmod +x kubectl && mv kubectl /usr/local/bin/
    args: { creates: /usr/local/bin/kubectl }
  - name: Check cluster
    ansible.builtin.command: kubectl cluster-info
    register: cluster_info
  - name: Debug
    ansible.builtin.debug: { var: cluster_info.stdout }
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook install_kubectl.yml
        </script>
