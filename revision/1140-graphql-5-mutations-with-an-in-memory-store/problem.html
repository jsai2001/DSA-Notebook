  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">GraphQL › 5. Mutations with an In-Memory Store</p>
      <p>Run a mutation, then fetch by the returned id:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="GraphQL">
mutation {
    createProduct(input: {
        name: "New Widget",
        description: "A brand new widget",
        price: 19.99,
        soldout: false,
        stores: [{ store: "New York" }]
    }) {
        id
        name
        price
    }
}
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="JSON">
{
    "data": {
        "createProduct": {
            "id": "a3f9c2e1b4d8...",
            "name": "New Widget",
            "price": 19.99
        }
    }
}
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="GraphQL">
query {
    getProduct(id: "<paste-id-from-mutation-response>") {
        name
        price
        description
    }
}
        </script>
      </div>
      <p>Enum + inventory version of the mutation (testing <code>inventory</code> and <code>soldout: ONSALE</code>):</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="GraphQL">
mutation {
    createProduct(input: {
        name: "Widget 99"
        description: "another widget for your garden"
        price: 12.99
        soldout: ONSALE
        inventory: 10
        stores: [{ store: "Pasadena" }]
    }) {
        name
        soldout
    }
}
        </script>
      </div>
