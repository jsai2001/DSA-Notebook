    <p class="rev-crumb">GitHub Actions › 7. Ready-made workflows › Deploy after tests and multi-stage deployments</p>
      <p><strong>Q. How do you deploy only after tests pass?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: npm run deploy
        </script>
      </div>
      <p><strong>Q. How do you do a multi-stage deployment?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: npm test
  deploy-dev:
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy dev"
        </script>
