    <p class="rev-crumb">Vector Databases › 2. Vector fundamentals › Similarity search workflow</p>
      <p>Query string -&gt; vectorize (same model as the data) -&gt; compare with base vectors -&gt; rank -&gt; return top-K.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from sentence_transformers import SentenceTransformer
import numpy as np

model = SentenceTransformer('all-MiniLM-L6-v2')
documents = [
    "Python is a programming language",
    "Machine learning uses algorithms",
    "Vector databases store embeddings",
    "Dogs are loyal pets"
]
doc_embeddings = model.encode(documents)
query_embedding = model.encode("What is Python?")

similarities = [
    np.dot(query_embedding, doc) / (np.linalg.norm(query_embedding) * np.linalg.norm(doc))
    for doc in doc_embeddings
]
top_idx = np.argmax(similarities)
print(f"Most similar: {documents[top_idx]}")   # "Python is a programming language"

# Top-K ranking
top_k_indices = np.argsort(similarities)[::-1][:3]
        </script>
