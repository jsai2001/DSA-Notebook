  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">SQL › 9. SQL Joins › Right join and full outer join</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
select sale.inventoryid, inventoryname
from inventory right join sale on
sale.inventoryid=inventory.inventoryid

-- full outer join shows everything; the where clause keeps inventory with no sales
select sale.inventoryid, inventoryname
from inventory
full outer join sale on
sale.inventoryid=inventory.inventoryid
where sale.inventoryid is NULL
        </script>
