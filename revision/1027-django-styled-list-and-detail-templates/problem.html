      <div class="code-tabs">
        <script type="text/plain" data-lang="HTML">
{% extends "base.html" %}
{% block content %}
  <h1 class="my-5">These are the notes:</h1>
  <div class="row row-cols-3 g-2">
    {% for note in notes %}
      <div class="col">
        <div class="p-3 border">
          <a href="{% url 'notes.detail' pk=note.id %}" class="text-dark text-decoration-none">{{ note.title }}</a>
          <p>{{ note.text|truncatechars:10 }}</p>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
        </script>
      </div>
      <p><code>|</code> applies a template filter; <code>truncatechars:10</code> shows the first 10 characters plus <code>...</code>.</p>
