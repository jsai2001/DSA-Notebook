    <section class="q-section rev-sec">
    <p class="rev-crumb">SQL › 9. SQL Joins › Left join</p>
      <p>A left join keeps every inventory row; rows with no sales get NULL. Adding <code>where sale.inventoryid is NULL</code> keeps only inventory that never sold.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
select inventory.inventoryid, inventoryname
from inventory left join sale on
sale.inventoryid=inventory.inventoryid

-- inventory with no sales
select inventory.inventoryid, inventoryname
from inventory left join sale on
sale.inventoryid=inventory.inventoryid
where sale.inventoryid is NULL

-- same result without a join: use a subquery
select inventoryid, inventoryname from inventory
where inventoryid not in (select inventoryid from sale)
        </script>
      </div>
