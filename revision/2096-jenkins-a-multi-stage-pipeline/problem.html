      <div class="code-tabs">
        <script type="text/plain" data-lang="Groovy">
pipeline {
    agent any
    stages {
        stage('Build') {
            steps { echo 'Building the application...' }
        }
        stage('Test') {
            steps {
                echo 'Running unit tests...'
                echo 'Running integration tests...'
                echo 'Running end-to-end tests...'
            }
        }
        stage('Deploy') {
            steps { echo 'Deploying to staging...' }
        }
        stage('Release') {
            steps { echo 'Releasing to production...' }
        }
    }
}
        </script>
      </div>
      <p>Jenkins draws a graphical view of the stages. Hover over a stage to see its logs and click a step for detailed logs.</p>
