    <p class="rev-crumb">FastAPI › 3. Handlers, Running the Server, Sync vs Async › Example: /info handler</p>
      <p>Returns version, current time and the running user. <code>datetime</code> is auto-serialized to an ISO string.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from datetime import datetime, UTC
from os import environ
from fastapi import FastAPI
app = FastAPI()

@app.get('/info')
def info():
    return {
        'version': '0.1.0',
        'time': datetime.now(tz=UTC),
        'user': environ['USER'],
    }
        </script>
      </div>

        </script>
