    <p class="rev-crumb">AWS CloudWatch › 11. Alarms › Alarm on Lambda errors: Boto3</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
cloudwatch = boto3.client('cloudwatch')
cloudwatch.put_metric_alarm(
    AlarmName='apiadmins',
    ComparisonOperator='GreaterThanThreshold',
    EvaluationPeriods=1,
    MetricName='Errors',
    Namespace='AWS/Lambda',
    Period=60,
    Statistic='Sum',
    Threshold=20.0,
    ActionsEnabled=True,
    AlarmActions=['arn:aws:sns:us-east-1:123456789012:apiadmins'],
    OKActions=['arn:aws:sns:us-east-1:123456789012:apiadmins'],
    AlarmDescription='Alarm when Lambda function errors exceed 20 per minute',
    Dimensions=[{'Name': 'FunctionName', 'Value': 'putitemFunction'}]
)
        </script>
      </div>
      <p>Use Sum (not Average) to count errors, short evaluation periods for quick detection, and test alarms by simulating failures.</p>
