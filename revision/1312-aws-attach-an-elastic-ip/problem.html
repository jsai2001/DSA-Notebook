    <p class="rev-crumb">AWS › 12. Hands-On: Provisioning with the AWS CLI › Attach an Elastic IP</p>
      <p><strong>Q. How do you attach an Elastic IP to an EC2 instance?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
# Allocate Elastic IP
aws ec2 allocate-address \
    --domain vpc \
    --region us-east-1
# Associate Elastic IP with instance
aws ec2 associate-address \
    --instance-id i-1234567890abcdef0 \
    --allocation-id eipalloc-12345678 \
    --region us-east-1
        </script>
      </div>
