        <script type="text/plain" data-lang="Python">
import requests
import json

# Step 1: location
location_response = requests.get("https://ipapi.co/json/")
city = json.loads(location_response.text)["city"]

# Step 2: weather for that city
weather_params = {"q": city, "appid": "YOUR_API_KEY"}
weather_response = requests.get("http://api.openweathermap.org/data/2.5/weather", params=weather_params)
weather_data = json.loads(weather_response.text)

# Step 3: use the result
temperature = weather_data["main"]["temp"]
print(f"Temperature in {city}: {temperature}K")
        </script>
