    <p class="rev-crumb">ML Algorithms › 4. PCA and Other Dimensionality Reduction › 4.1 Running PCA</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from sklearn.decomposition import PCA
from sklearn import set_config
import sklearn.datasets
import matplotlib.pyplot as plt
set_config(transform_output='pandas')
dataset = sklearn.datasets.load_iris(as_frame=True)
X = (dataset
     ['data']
     .loc[:, ['sepal length (cm)', 'sepal width (cm)']]
)
y = dataset['target']
# Run PCA on the first two components of the Iris dataset
pca = PCA(n_components=2)
pca.fit(X)
X_pca = pca.transform(X)
# plot the results
fig, ax = plt.subplots(figsize=(8, 6))
ax.scatter(X_pca['pca0'], X_pca['pca1'], c=y, cmap='viridis')
ax.set_xlabel('PC1')
ax.set_ylabel('PC2')
ax.set_title('PCA on Iris Data')
        </script>
      </div>
      <p>On all four Iris features (the plot code is the same as above):</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
# Run PCA on all of the Iris dataset
pca = PCA()
X_all = (dataset
     ['data']
)
pca.fit(X_all)
X_pca = pca.transform(X_all)
        </script>
      </div>
      <p>scikit-learn names components <code>pca0</code>, <code>pca1</code>, ...; the literature says PC1, PC2. Rename if you like:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
def rename_pc0_to_PC1(col):
    num = int(col[3:]) + 1
    return 'PC' + str(num)
X_pca.rename(columns=rename_pc0_to_PC1)
        </script>
      </div>
