    <section class="q-section rev-sec">
    <p class="rev-crumb">Ansible › 12. On-Call Ansible Tasks › Ad-hoc pings, copy and uptime</p>
      <p><strong>Q. Ad-hoc command to ping all hosts?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible all -m ping
        </script>
      </div>
      <p><strong>Q. Copy <code>config.conf</code> to <code>/etc/app/</code>?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible all -m copy -a "src=config.conf dest=/etc/app/config.conf owner=root mode=0644" --become
        </script>
      </div>
      <p><strong>Q. Check uptime of <code>dbservers</code>?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible dbservers -m command -a "uptime"
        </script>
      </div>
      <p><strong>Q. Update the package cache on Ubuntu?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible all -m apt -a "update_cache=yes" --become -l ubuntu_hosts
        </script>
      </div>
