<details class="question" id="q-ansible-052-dynamic-inventory-with-aws-ec2" data-group="ansible" data-sec="ansible-s053">
  <summary>
    <span class="q-title">Dynamic inventory with aws_ec2</span>
    <span class="q-meta">
      <span class="tag">Ansible</span>
    </span>
  </summary>
  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">Ansible › 9. Advanced Features and Scaling › Dynamic inventory with aws_ec2</p>
      <p>The <code>aws_ec2</code> plugin needs <code>boto3</code>.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
pip install boto3
        </script>
      </div>
      <p><code>aws_inventory.yml</code>:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
plugin: aws_ec2
regions:
  - us-east-1
filters:
  instance-state-name: running
keyed_groups:
  - key: tags.Role
    separator: ''
        </script>
      </div>
      <p><code>aws_playbook.yml</code>:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Run on AWS instances
  hosts: all
  tasks:
    - name: Check uptime
      ansible.builtin.command: uptime
      register: uptime_result

    - name: Display uptime
      ansible.builtin.debug:
        msg: "{{ uptime_result.stdout }}"
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook -i aws_inventory.yml aws_playbook.yml
        </script>
      </div>
      <p>Running instances in <code>us-east-1</code> are discovered and grouped by the <code>Role</code> tag.</p>
