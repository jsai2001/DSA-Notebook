      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create a DynamoDB table
  hosts: localhost
  tasks:
    - name: Create DynamoDB table
      amazon.aws.dynamodb_table:
        name: "my-dynamodb-table"
        hash_key_name: "id"
        hash_key_type: "S"
        read_capacity: 5
        write_capacity: 5
        region: "us-east-1"
        </script>
