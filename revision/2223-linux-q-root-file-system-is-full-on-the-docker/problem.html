  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">Linux › 7. On-Call: Disk, Inodes and I/O › Q. Root file system is full on the Docker host</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
df -h /
du -ah / | sort -rh | head -n 10
docker system prune -a --volumes
docker image prune -f
truncate -s 0 /var/log/*.log
        </script>
      </div>
      <p>Avoid deleting critical data, use <code>logrotate</code> and check container logs.</p>
