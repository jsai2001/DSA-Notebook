  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">Angular › 5. Templates and Data Binding › Template reference variable</p>
      <p><code>#name</code> on an element gives the template access to that element's DOM data without passing it to the class.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="HTML">
<div class="input-group my-4">
  <input type="text" class="form-control" placeholder="Find Players by Name"
         #filter (keyup)="update(filter.value)">
  <button class="btn btn-light" type="button"
          (click)="update(''); filter.value = ''">Clear</button>
</div>

<ul *ngIf="players$ | async as players; else loading" class="my-4">
  <li *ngFor="let player of players" [appOnlineStatus]="player.online">
    <a [routerLink]="['/profile', player.id]">{{ player.name }}</a>
  </li>
</ul>

<ng-template #loading>
  <p class="my-4">Loading&hellip;</p>
</ng-template>
        </script>
      </div>
      <p>This one template uses every concept below.</p>
