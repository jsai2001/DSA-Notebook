  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">SQL › 13. Worked Examples › Split a column with PARSENAME</p>
      <p><code>PARSENAME('object_name', object_piece)</code> numbers the pieces from right to left. It splits on <code>.</code>, so <code>REPLACE</code> turns commas into dots first.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
Select OwnerAddress,
PARSENAME(REPLACE(OwnerAddress, ',', '.') , 3),
PARSENAME(REPLACE(OwnerAddress, ',', '.') , 2),
PARSENAME(REPLACE(OwnerAddress, ',', '.') , 1)
From NashvilleHousing

ALTER TABLE NashvilleHousing
Add OwnerSplitAddress Nvarchar(255);
ALTER TABLE NashvilleHousing
Add OwnerSplitCity Nvarchar(255);
ALTER TABLE NashvilleHousing
Add OwnerSplitState Nvarchar(255);

Update NashvilleHousing
SET OwnerSplitAddress = PARSENAME(REPLACE(OwnerAddress, ',', '.') , 3)
Update NashvilleHousing
SET OwnerSplitCity = PARSENAME(REPLACE(OwnerAddress, ',', '.') , 2)
Update NashvilleHousing
SET OwnerSplitState = PARSENAME(REPLACE(OwnerAddress, ',', '.') , 1)
        </script>
      </div>
