  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">SQL › 6. Expressions and Functions › PARTITION BY</p>
      <p><code>GROUP BY</code> collapses rows. <code>OVER (PARTITION BY ...)</code> returns a single value for each row while still showing the detail columns.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
SELECT FirstName, LastName, Gender, Salary,
COUNT(Gender) OVER (PARTITION BY Gender) AS TotalGender
FROM EmployeeDemographics ED
JOIN EmployeeSalary ES
ON ED.EmployeeID = ES.EmployeeID
        </script>
      </div>
