    <p class="rev-crumb">Advanced RAG › 6. End-to-End Text RAG Demo (LangChain + FAISS) › Chunk</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from langchain.schema import Document
from langchain.text_splitter import CharacterTextSplitter
import os

data_folder = "Big_Star_Collectibles"
files = os.listdir(data_folder)

all_docs = []
for file in files:
    with open(os.path.join(data_folder, file), "r") as f:
        text = f.read()
    # 128 character chunks with 32 character overlap
    splitter = CharacterTextSplitter(chunk_size=128, chunk_overlap=32)
    chunks = splitter.split_text(text)
    for chunk in chunks:
        all_docs.append(Document(page_content=chunk))
print(all_docs[0].page_content)
        </script>
      </div>
      <p><code>CharacterTextSplitter</code> treats chunk size as a guideline; some chunks exceed 128 chars (fixed in Challenge 2).</p>
