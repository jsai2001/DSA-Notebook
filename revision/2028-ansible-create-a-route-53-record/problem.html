      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create a Route 53 record
  hosts: localhost
  tasks:
    - name: Create Route 53 record
      amazon.aws.route53:
        state: present
        zone: "example.com"
        record: "www.example.com"
        type: "A"
        value: "192.0.2.1"
        region: "us-east-1"
