    <p class="rev-crumb">Ansible › 15. Provisioning AWS with Ansible › Create an RDS instance</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create an RDS instance
  hosts: localhost
  tasks:
    - name: Launch RDS instance
      amazon.aws.rds_instance:
        identifier: "my-rds-instance"
        engine: "mysql"
        instance_type: "db.t3.micro"
        username: "admin"
        password: "{{ rds_master_password }}"
        allocated_storage: 20
        region: "us-east-1"
        vpc_security_group_ids: "sg-12345678"
        subnet_group: "my-subnet-group"
        </script>
