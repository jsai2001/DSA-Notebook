    <section class="q-section rev-sec">
    <p class="rev-crumb">GitHub Actions › 7. Ready-made workflows › Notifications</p>
      <p><strong>Q. Send Slack notifications.</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
on: push
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Running"
      - if: success() || failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: 'my-channel'
          text: 'Workflow ${{ job.status }}!'
        </script>
      </div>
      <p><strong>Q. Send a Slack notification only on failure.</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
steps:
  - uses: actions/checkout@v3
  - run: exit 1
  - if: failure()
    uses: slackapi/slack-github-action@v1.23.0
    with:
      slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
      channel-id: 'general'
      text: 'Workflow failed!'
        </script>
      </div>
