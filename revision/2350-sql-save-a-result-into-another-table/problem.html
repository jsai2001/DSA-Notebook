    <p class="rev-crumb">SQL › 4. Filtering and Sorting › Save a result into another table</p>
      <p><code>into</code> stores the result in a new base table; data types are kept.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
select distinct customerlastname into temp
from customer
order by customerlastname

select * from temp
        </script>
