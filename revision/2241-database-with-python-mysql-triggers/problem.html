      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
DELIMITER //
CREATE TRIGGER after_employee_insert
AFTER INSERT ON employees
FOR EACH ROW
BEGIN
    INSERT INTO audit_log (action, employee_id, action_date)
    VALUES ('INSERT', NEW.id, NOW());
END //
DELIMITER ;

SHOW TRIGGERS;
DROP TRIGGER after_employee_insert;
        </script>

      <p><strong>Q. What are triggers for and what do they cost?</strong> Logging and enforcing rules. They add performance overhead.</p>
