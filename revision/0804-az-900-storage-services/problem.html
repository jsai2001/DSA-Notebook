      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
# Create a file share
az storage share create \
  --name myfileshare \
  --account-name az900storage \
  --quota 50

# Upload a file
az storage file upload \
  --share-name myfileshare \
  --account-name az900storage \
  --source ./report.pdf

# List files in the share
az storage file list --share-name myfileshare --account-name az900storage --output table
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
# Mount the Azure file share on Linux
sudo mount -t cifs \
  //az900storage.file.core.windows.net/myfileshare /mnt/myshare \
  -o vers=3.0,username=az900storage,password=<storage-account-key>,dir_mode=0777,file_mode=0777
        </script>
