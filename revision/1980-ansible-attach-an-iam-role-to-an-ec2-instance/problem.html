  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">Ansible › 15. Provisioning AWS with Ansible › Attach an IAM role to an EC2 instance</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Attach an IAM role to an EC2 instance
  hosts: localhost
  tasks:
    - name: Create instance profile and attach role
      amazon.aws.iam_instance_profile:
        name: "my-instance-profile"
        roles: "my-iam-role"
        region: "us-east-1"
    - name: Attach instance profile to EC2
      amazon.aws.ec2_instance:
        instance_ids: "i-1234567890abcdef0"
        iam_instance_profile: "my-instance-profile"
        region: "us-east-1"
        state: present
        </script>
