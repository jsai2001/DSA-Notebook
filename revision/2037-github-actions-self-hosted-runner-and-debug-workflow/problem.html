      <p><strong>Q. How do you print debug output in a workflow?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
name: Debug Workflow
on: [push]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Debugging enabled" && ls -la
        env:
          ACTIONS_STEP_DEBUG: true
        </script>
