    <section class="q-section rev-sec">
    <p class="rev-crumb">GitHub Actions › 13. Hands-on: AWS resources from workflows › S3, DynamoDB and RDS</p>
      <p>Create an S3 bucket:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create S3 Bucket
  run: |
    aws s3api create-bucket \
      --bucket my-unique-bucket-name
        </script>
      </div>
      <p>Create a DynamoDB table:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create DynamoDB Table
  run: |
    aws dynamodb create-table \
      --table-name my-dynamodb-table \
      --attribute-definitions AttributeName=id,AttributeType=S \
      --key-schema AttributeName=id,KeyType=HASH \
      --billing-mode PAY_PER_REQUEST
        </script>
      </div>
      <p>Create an RDS instance (keep the password in a secret):</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Launch RDS Instance
  run: |
    aws rds create-db-instance \
      --db-instance-identifier my-rds-instance \
      --db-instance-class db.t3.micro \
      --engine mysql \
      --master-username admin \
      --master-user-password "${{ secrets.DB_PASSWORD }}" \
      --allocated-storage 20 \
      --vpc-security-group-ids sg-12345678 \
      --db-subnet-group-name my-subnet-group
        </script>
      </div>
