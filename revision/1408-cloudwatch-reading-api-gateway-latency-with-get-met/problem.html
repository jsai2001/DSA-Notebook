    <p class="rev-crumb">AWS CloudWatch › 3. Metrics › Reading API Gateway latency with get_metric_data</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
import boto3
from datetime import datetime, timedelta

cloudwatch = boto3.client('cloudwatch')
response = cloudwatch.get_metric_data(
    MetricDataQueries=[
        {
            'Id': 'm1',
            'MetricStat': {
                'Metric': {
                    'Namespace': 'AWS/ApiGateway',
                    'MetricName': 'Latency',
                    'Dimensions': [
                        {'Name': 'ApiName', 'Value': 'cloudwatchcourseapi'}
                    ]
                },
                'Period': 60,
                'Stat': 'Average'
            }
        }
    ],
    StartTime=datetime.utcnow() - timedelta(minutes=60),
    EndTime=datetime.utcnow()
)
        </script>
