    <section class="q-section rev-sec">
    <p class="rev-crumb">AWS CloudFormation › 8. S3 Static Website Template (JSON) › S3 website bucket template</p>
      <p>This template creates a static HTML website on S3.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="JSON">
{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Sample template showing how to create a publicly accessible S3 bucket configured for website access with a deletion policy of retain on delete.",
  "Resources": {
    "S3Bucket": {
      "Type": "AWS::S3::Bucket",
      "Properties": {
        "AccessControl": "PublicRead",
        "WebsiteConfiguration": {
          "IndexDocument": "index.html",
          "ErrorDocument": "error.html"
        }
      },
      "DeletionPolicy": "Retain"
    }
  },
  "Outputs": {
    "WebsiteURL": {
      "Value": { "Fn::GetAtt": ["S3Bucket", "WebsiteURL"] },
      "Description": "URL for website hosted on S3"
    }
  }
}
        </script>
      </div>
