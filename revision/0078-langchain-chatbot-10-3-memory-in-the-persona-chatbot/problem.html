      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from langchain.memory import ConversationBufferMemory
from langchain.chains import ConversationChain

class EnhancedChatbot:
    def __init__(self):
        self.setup_memory()
        self.setup_chain()

    def setup_memory(self):
        """Initialize conversation memory"""
        self.memory = ConversationBufferMemory(
            return_messages=True,
            memory_key="chat_history"
        )

    def setup_chain(self):
        """Setup conversation chain with memory"""
        prompt = open('website_text.txt', 'r').read()
        template = f"""
        {prompt}
        You are Mr. Landon, the hotel manager of Landon Hotel.
        Use the conversation history to provide contextual responses.

        Current conversation:
        {{chat_history}}
        Human: {{input}}
        Mr. Landon:"""

        self.chain = ConversationChain(
            llm=OpenAI(temperature=0),
            memory=self.memory,
            prompt=PromptTemplate(
                input_variables=["chat_history", "input"],
                template=template
            )
        )

    def get_response(self, user_input):
        """Get response with conversation context"""
        return self.chain.predict(input=user_input)

# Flask integration
enhanced_chatbot = EnhancedChatbot()

@app.route("/chatbot", methods=["POST"])
def chatbot():
    data = request.get_json()
    question = data["question"]
    response = enhanced_chatbot.get_response(question)
    return jsonify({"response": response})
        </script>
