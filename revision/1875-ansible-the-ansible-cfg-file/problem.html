    <p class="rev-crumb">Ansible › 2. Installation and ansible.cfg › The ansible.cfg file</p>
      <p><strong>Q. Purpose of the <code>ansible.cfg</code> file?</strong> It customizes Ansible: inventory path, SSH options, escalation settings. It avoids repeating CLI flags and keeps runs consistent.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Ini">
[defaults]
inventory = ./inventory
remote_user = ansible
private_key_file = ~/.ssh/id_rsa
host_key_checking = False
retry_files_enabled = False
log_path = ./ansible.log

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
        </script>
      </div>
