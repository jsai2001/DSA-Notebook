    <p class="rev-crumb">Python Automation › 10. Selenium Browser Automation › Filling a form</p>
      <p>Get an XPath by right-clicking the element in Inspect, then Copy, then Copy XPath.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
from selenium import webdriver
from selenium.webdriver.chrome.service import Service as ChromeService
from webdriver_manager.chrome import ChromeDriverManager
from selenium.webdriver.common.by import By
from time import sleep

url = "https://example.com/form"

driver = webdriver.Chrome(service=ChromeService(ChromeDriverManager().install()))
driver.maximize_window()
driver.get(url)

# Same two lines repeated for last name, telephone, password, password confirm
first_name = driver.find_element(By.XPATH, '//*[@id="input-firstname"]')
first_name.send_keys("John")
email = driver.find_element(By.XPATH, '//*[@id="input-email"]')
email.send_keys("john.doe@example.com")

# Radio button and checkbox: click
driver.find_element(By.XPATH, '//*[@id="newsletter-no"]').click()
driver.find_element(By.XPATH, '//*[@id="agree"]').click()

# Submit
driver.find_element(By.XPATH, '//*[@id="submit"]').click()

# Scroll down 200 px to see the lower part of the page
driver.execute_script("window.scrollTo(0, window.scrollY + 200)")

sleep(5)        # pause to view the result
driver.quit()   # always close the browser to free resources
        </script>
