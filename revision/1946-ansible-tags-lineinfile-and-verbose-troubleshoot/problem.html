    <p class="rev-crumb">Ansible › 12. On-Call Ansible Tasks › Tags, lineinfile and verbose troubleshooting</p>
      <p><strong>Q. Run a playbook with the <code>deploy</code> tag?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook playbook.yml --tags "deploy"
        </script>
      </div>
      <p><strong>Q. Ensure a line in <code>/etc/hosts</code>?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Update hosts
  hosts: all
  become: yes
  tasks:
  - name: Add line
    ansible.builtin.lineinfile: { path: /etc/hosts, line: "192.168.1.100 app.example.com" }
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook update_hosts.yml
        </script>
      </div>
      <p><strong>Q. Troubleshoot a playbook with verbose output?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook playbook.yml -v
        </script>
      </div>
