    <p class="rev-crumb">AWS › 17. Terraform for AWS: Scaling and Load Balancing › EC2 launch template</p>
      <p><strong>Q. How do you build EC2 Auto Scaling with Terraform?</strong> Start with a launch template.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Hcl">
resource "aws_launch_template" "web_template" {
  name_prefix   = "web-lt"
  image_id      = "ami-0abcdef1234567890"
  instance_type = "t3.micro"
  key_name      = "my-key"
  network_interfaces {
    associate_public_ip_address = true
    security_groups             = [aws_security_group.web_sg.id]
  }
  user_data = base64encode(<<-EOF
              #!/bin/bash
              echo "Hello from AutoScaling EC2" > index.html
              nohup python3 -m http.server 80 &
              EOF
            )
}
        </script>
