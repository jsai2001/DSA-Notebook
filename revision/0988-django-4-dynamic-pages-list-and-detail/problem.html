      <p>Function-based list view, URLs and template:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
# notes/views.py
from . import models

def list(request):
    all_notes = models.Notes.objects.all()
    return render(request, 'notes/notes_list.html', {'notes': all_notes})
        </script>

        <script type="text/plain" data-lang="Python">
# notes/urls.py
urlpatterns = [
    path('notes', views.list),
]

# smartnotes/urls.py: prefixes every notes URL with smart/ -> smart/notes
urlpatterns = [
    path('smart/', include('notes.urls')),
]
        </script>

</ul>
