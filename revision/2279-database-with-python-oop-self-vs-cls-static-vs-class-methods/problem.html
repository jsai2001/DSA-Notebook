      <p><strong>Q. <code>self</code> vs <code>cls</code>?</strong> <code>self</code> refers to the instance. <code>cls</code> refers to the class.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
class C:
    @classmethod
    def f(cls):
        print(cls)

C.f()  # "<class '__main__.C'>"
        </script>
      </div>
      <p><strong>Q. Static vs class methods?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
class C:
    @staticmethod
    def s():
        print("Static")

    @classmethod
    def c(cls):
        print("Class")

C.s()
C.c()
        </script>
