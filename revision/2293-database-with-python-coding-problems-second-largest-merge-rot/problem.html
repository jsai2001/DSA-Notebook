      <p><strong>Q. Second largest in a list?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
def second_max(lst):
    if len(lst) < 2: return None
    m1, m2 = max(lst[0], lst[1]), min(lst[0], lst[1])
    for x in lst[2:]:
        m1, m2 = (x, m1) if x > m1 else (m1, x if x > m2 else m2)
    return m2

print(second_max([1, 5, 3]))  # 3
        </script>
      </div>
      <p><strong>Q. Merge two sorted lists?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
def merge(l1, l2):
    r, i, j = [], 0, 0
    while i < len(l1) and j < len(l2):
        if l1[i] < l2[j]:
            r.append(l1[i])
            i += 1
        else:
            r.append(l2[j])
            j += 1
    return r + l1[i:] + l2[j:]

print(merge([1, 3], [2, 4]))  # [1, 2, 3, 4]
        </script>
      </div>
      <p><strong>Q. Rotate a list by <code>k</code>?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
def rotate(lst, k):
    k %= len(lst)
    return lst[-k:] + lst[:-k]

print(rotate([1, 2, 3], 1))  # [3, 1, 2]
        </script>
