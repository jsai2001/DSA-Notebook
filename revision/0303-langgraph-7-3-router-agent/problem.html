      <p>More forgiving <code>find_route</code> from the lesson (substring match, lower-case keys, fallback <code>"end"</code>):</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
def find_route(self, state: RouterAgentState) -> str:
    """Determine routing destination based on LLM output"""
    last_message = state["messages"][-1]
    route_decision = last_message.content.lower().strip()

    # Map LLM output to routing destinations
    if "product" in route_decision:
        return "product"
    elif "order" in route_decision:
        return "order"
    elif "small_talk" in route_decision or "small talk" in route_decision:
        return "small_talk"
    else:
        return "end"
        </script>
