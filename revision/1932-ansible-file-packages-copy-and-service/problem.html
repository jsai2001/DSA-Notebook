  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">Ansible › 6. Modules › file, packages, copy and service</p>
      <p><strong>Q. Use the <code>file</code> module?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- file:
    path: /opt/app
    state: directory
    mode: '0755'
- file:
    path: /tmp/test.txt
    state: absent
        </script>
      </div>
      <p><strong>Q. Install a package with <code>yum</code>/<code>apt</code>?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- yum:
    name: httpd
    state: present
- apt:
    name: nginx
    state: present
        </script>
      </div>
      <p><strong>Q. What is the <code>copy</code> module for?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- copy:
    src: config.conf
    dest: /etc/app/config.conf
    mode: '0644'
        </script>
      </div>
      <p><strong>Q. Manage services with <code>service</code>?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- service:
    name: nginx
    state: started
    enabled: yes
        </script>
      </div>
