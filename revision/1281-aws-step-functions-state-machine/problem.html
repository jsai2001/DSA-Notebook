    <p class="rev-crumb">AWS › 13. Hands-On: CloudFormation Templates › Step Functions state machine</p>
      <p><strong>Q. How do you create a Step Functions state machine with CloudFormation?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
Resources:
    MyStateMachine:
        Type: AWS::StepFunctions::StateMachine
        Properties:
            StateMachineName: my-state-machine
            RoleArn: arn:aws:iam::123456789012:role/step-functions-role
            DefinitionString: |
                {
                    "StartAt": "Hello",
                    "States": {
                        "Hello": {
                            "Type": "Pass",
                            "Result": "Hello World",
                            "End": true
                        }
                    }
                }
        </script>
      </div>
