    <section class="q-section rev-sec">
    <p class="rev-crumb">GitHub Actions › 13. Hands-on: AWS resources from workflows › RDS security group and snapshot</p>
      <p>Attach a security group to an RDS instance:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Attach Security Group
  run: |
    aws rds modify-db-instance \
      --db-instance-identifier my-rds-instance \
      --vpc-security-group-ids sg-12345678 \
      --apply-immediately
        </script>
      </div>
      <p>Create an RDS snapshot:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create RDS Snapshot
  run: |
    aws rds create-db-snapshot \
      --db-instance-identifier my-rds-instance \
      --db-snapshot-identifier my-rds-snapshot
        </script>
      </div>
