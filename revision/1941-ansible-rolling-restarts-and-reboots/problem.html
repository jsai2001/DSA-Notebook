    <p class="rev-crumb">Ansible › 12. On-Call Ansible Tasks › Rolling restarts and reboots</p>
      <p><strong>Q. Restart <code>webservers</code> sequentially?</strong> <code>serial: 1</code> processes one host at a time.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Restart webservers
  hosts: webservers
  become: yes
  serial: 1
  tasks:
  - name: Restart
    ansible.builtin.reboot:
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook reboot_webservers.yml
        </script>
      </div>
      <p><strong>Q. Reboot hosts and wait for them to return?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible all -m reboot -a "reboot_timeout=300" --become
        </script>
      </div>
