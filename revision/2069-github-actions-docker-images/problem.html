    <p class="rev-crumb">GitHub Actions › 7. Ready-made workflows › Docker images</p>
      <p><strong>Q. Build and push a Docker image.</strong> Log in with <code>docker/login-action</code>, then use <code>docker/build-push-action</code>.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: user/app:latest
        </script>
      </div>
      <p><strong>Q. Build and push to Docker Hub with plain docker commands.</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
name: Build Docker
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app:latest
        </script>
      </div>
