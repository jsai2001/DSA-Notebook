      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
# main.py
from dotenv import load_dotenv
from langchain_openai import OpenAI
from colorama import Fore
load_dotenv()
# Step 1: Initialize the language model
llm = OpenAI()
def ask_question(text):
    # Step 2: Provide text input and invoke the model
    result = llm.invoke(text)
    # Step 3: Return the generated output
    return result
# Simple CLI interface
def main():
    while True:
        print(f"\n{Fore.CYAN}1. Ask a question")
        print(f"2. Exit{Fore.RESET}")
        choice = input("\nSelect an option: ")
        if choice == "1":
            question = input(f"\n{Fore.GREEN}Enter your question: {Fore.RESET}")
            response = ask_question(question)
            print(f"\n{Fore.YELLOW}{response}{Fore.RESET}")
        elif choice == "2":
            print("Goodbye!")
            break
if __name__ == "__main__":
    main()
        </script>
