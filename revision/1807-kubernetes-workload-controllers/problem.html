      <p><strong>Q. How do you create a ReplicaSet with 2 replicas?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: my-replicaset
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        </script>
      </div>
      <p><strong>Q. How do you create a StatefulSet with 2 replicas?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-statefulset
spec:
  serviceName: "nginx"
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        </script>
      </div>
      <p><strong>Q. How do you create a DaemonSet?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: my-daemonset
spec:
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      containers:
      - name: fluentd
        image: fluentd
        </script>
