    <p class="rev-crumb">Ansible › 15. Provisioning AWS with Ansible › Create a CloudWatch alarm for an EC2 instance</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create a CloudWatch alarm for an EC2 instance
  hosts: localhost
  tasks:
    - name: Create CloudWatch alarm
      amazon.aws.cloudwatch_metric_alarm:
        alarm_name: "ec2-cpu-alarm"
        metric_name: "CPUUtilization"
        namespace: "AWS/EC2"
        statistic: "Average"
        period: 300
        evaluation_periods: 2
        threshold: 80
        comparison_operator: "GreaterThanThreshold"
        dimensions:
          InstanceId: "i-1234567890abcdef0"
        alarm_actions: ["arn:aws:sns:us-east-1:123456789012:my-topic"]
        region: "us-east-1"
        </script>
      </div>
