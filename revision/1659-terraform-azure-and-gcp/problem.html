    <p class="rev-crumb">Terraform › 11. Terraform with Cloud Providers › Azure and GCP</p>
      <p><strong>Q. How do you create an Azure resource group and VNet?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Hcl">
resource "azurerm_resource_group" "rg" { 
    name = "my-rg" 
}
resource "azurerm_virtual_network" "vnet" { 
    name = "my-vnet" 
}
        </script>
      </div>
      <p><strong>Q. How do you create a GCP Compute Engine instance?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Hcl">
resource "google_compute_instance" "vm" { 
    name = "my-vm" 
    machine_type = "e2-medium" 
}
        </script>
      </div>
