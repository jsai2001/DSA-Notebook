        <script type="text/plain" data-lang="CSS">
/* Responsive design for mobile devices */
@media (max-width: 768px) {
    .chatbot-container {
        margin: 10px;
        border-radius: 10px;
    }
    #chat-container {
        height: 400px;
        padding: 15px;
    }
    .message {
        max-width: 85%;
        font-size: 14px;
    }
    .input-container {
        padding: 15px;
        flex-direction: column;
    }
    #user-input {
        margin-bottom: 10px;
        font-size: 16px; /* Prevents zoom on iOS */
    }
    #send-btn {
        margin-left: 0;
        width: 100%;
    }
}
