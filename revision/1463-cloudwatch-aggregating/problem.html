    <span class="q-meta">

  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">AWS CloudWatch › 6. Logs Insights › Aggregating</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Plaintext">
fields @message
| filter @message like /exception/
| stats count(*) as error_count
        </script>
      </div>
      <p>Group into time buckets to see error trends:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Plaintext">
fields @message
| filter @message like /exception/
| stats count(*) as error_count by bin(5m)
        </script>
      </div>
