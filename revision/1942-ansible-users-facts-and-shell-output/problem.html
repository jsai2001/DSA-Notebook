    <p class="rev-crumb">Ansible › 12. On-Call Ansible Tasks › Users, facts and shell output</p>
      <p><strong>Q. Playbook for user <code>devops</code> with UID 2000?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create devops user
  hosts: all
  become: yes
  tasks:
  - name: Create user
    ansible.builtin.user: { name: devops, uid: 2000, state: present }
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook create_user.yml
        </script>
      </div>
      <p><strong>Q. Set a fact based on the OS distribution?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Set OS fact
  hosts: all
  tasks:
  - name: Set fact
    ansible.builtin.set_fact: { os_dist: "{{ ansible_facts['distribution'] }}" }
  - name: Debug
    ansible.builtin.debug: { var: os_dist }
        </script>
      </div>
      <p><strong>Q. Run a shell command and register the output?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Run shell
  hosts: all
  tasks:
  - name: Get disk space
    ansible.builtin.shell: "df -h /"
    register: disk_space
  - name: Debug
    ansible.builtin.debug: { var: disk_space.stdout }
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook shell_command.yml
        </script>
      </div>
