    <p class="rev-crumb">SQL › 11. Views, Temp Tables, CTEs and Table Copies › View</p>
      <p>A view is the result set of a SQL statement. It is not stored data, and it is updated when the base tables are updated.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
create view CustomerView as
select customerfirstname+' '+customerlastname as [Customer Name],
customerphonenumber,
inventoryname, saledate, salequantity, saleunitprice,
salequantity*saleunitprice as [Total Amount]
from customer inner join sale on customer.customerid=sale.customerid
inner join inventory
on sale.inventoryid=inventory.inventoryid
        </script>
