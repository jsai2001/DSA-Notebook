  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">SQL › 6. Expressions and Functions › CASE statement</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
SELECT FirstName, LastName, Age,
CASE
WHEN Age > 30 THEN 'Old'
WHEN Age BETWEEN 27 AND 30 THEN 'Young'
ELSE 'Baby'
END
FROM EmployeeDemographics ED
WHERE Age IS NOT NULL
ORDER BY Age
        </script>
      </div>
      <p><code>CASE</code> can also compute values, here a raise by job title:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
SELECT FirstName, LastName, JobTitle, Salary,
CASE
WHEN JobTitle = 'Salesman' THEN Salary + (Salary *.10)
WHEN JobTitle = 'Accountant' THEN Salary + (Salary *.05)
WHEN JobTitle = 'HR' THEN Salary + (Salary *.000001)
ELSE Salary + (Salary *.03)
END AS SalaryAfterRaise
FROM EmployeeDemographics ED
JOIN EmployeeSalary ES
ON ED.EmployeeID = ES.EmployeeID
        </script>
      </div>
