    <p class="rev-crumb">AWS › 19. Troubleshooting ECR Image Pulls on EKS › Fix registry authentication</p>
      <p>Step 3: check that the pod spec has <code>imagePullSecrets</code>.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
spec:
  imagePullSecrets:
  - name: ecr-secret
        </script>
      </div>
      <p>Create or update the ECR secret.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
aws ecr get-login-password --region <region> | kubectl create secret docker-registry ecr-secret \
  --docker-server=<aws-account-id>.dkr.ecr.<region>.amazonaws.com \
  --docker-username=AWS \
  --docker-password=$(aws ecr get-login-password --region <region>) \
  --namespace <namespace>
        </script>
      </div>
