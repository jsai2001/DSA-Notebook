    <p class="rev-crumb">Ansible › 12. On-Call Ansible Tasks › Install httpd and manage nginx</p>
      <p><strong>Q. Playbook to install <code>httpd</code> on <code>webservers</code>?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Install httpd
  hosts: webservers
  become: yes
  tasks:
  - name: Install httpd
    ansible.builtin.yum: { name: httpd, state: present }
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook install_httpd.yml
        </script>
      </div>
      <p><strong>Q. Playbook to start and enable <code>nginx</code>?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Manage nginx
  hosts: all
  become: yes
  tasks:
  - name: Install nginx
    ansible.builtin.package: { name: nginx, state: present }
  - name: Start nginx
    ansible.builtin.service: { name: nginx, state: started, enabled: yes }
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
ansible-playbook nginx_service.yml
        </script>
      </div>
