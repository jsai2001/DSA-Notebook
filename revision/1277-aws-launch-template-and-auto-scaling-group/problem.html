    <p class="rev-crumb">AWS › 12. Hands-On: Provisioning with the AWS CLI › Launch template and Auto Scaling group</p>
      <p><strong>Q. How do you create an Auto Scaling group from an EC2 launch template?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
# Create launch template
aws ec2 create-launch-template \
    --launch-template-name my-launch-template \
    --version-description "v1" \
    --launch-template-data '{"ImageId":"ami-0c55b159cbfafe1f0","InstanceType":"t2.micro","KeyName":"my-key-pair","SecurityGroupIds":["sg-12345678"]}' \
    --region us-east-1
# Create Auto Scaling group
aws autoscaling create-auto-scaling-group \
    --auto-scaling-group-name my-asg \
    --launch-template LaunchTemplateName=my-launch-template,Version=1 \
    --min-size 1 \
    --max-size 3 \
    --desired-capacity 2 \
    --vpc-zone-identifier subnet-12345678,subnet-87654321 \
    --region us-east-1
        </script>
      </div>
