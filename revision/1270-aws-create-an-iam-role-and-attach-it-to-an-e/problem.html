    <section class="q-section rev-sec">
    <p class="rev-crumb">AWS › 12. Hands-On: Provisioning with the AWS CLI › Create an IAM role and attach it to an EC2 instance</p>
      <p><strong>Q. How do you create an IAM role and attach it to an EC2 instance?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
# Create IAM role
aws iam create-role \
    --role-name ec2-role \
    --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
# Attach policy to role
aws iam attach-role-policy \
    --role-name ec2-role \
    --policy-arn arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
# Create instance profile
aws iam create-instance-profile \
    --instance-profile-name ec2-instance-profile
# Add role to instance profile
aws iam add-role-to-instance-profile \
    --instance-profile-name ec2-instance-profile \
    --role-name ec2-role
# Attach to EC2 instance
aws ec2 associate-iam-instance-profile \
    --instance-id i-1234567890abcdef0 \
    --iam-instance-profile Name=ec2-instance-profile
        </script>
      </div>
