  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">Terraform › 15. Hands-On: IAM, Serverless, Messaging, Containers and Monitoring › Attach a Lambda Function to an SNS Topic using Terraform</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Hcl">
resource "aws_sns_topic" "my_sns_topic" {
    name = "my-sns-topic"
}

resource "aws_lambda_function" "my_lambda" {
    function_name = "my-lambda-function"
    handler       = "index.handler"
    runtime       = "nodejs18.x"
    role          = "arn:aws:iam::123456789012:role/lambda-exec-role"
    filename      = "lambda-code.zip"
}

resource "aws_sns_topic_subscription" "lambda_sns" {
    topic_arn = aws_sns_topic.my_sns_topic.arn
    protocol  = "lambda"
    endpoint  = aws_lambda_function.my_lambda.arn
}

resource "aws_lambda_permission" "sns_invoke" {
    statement_id  = "AllowExecutionFromSNS"
    action        = "lambda:InvokeFunction"
    function_name = aws_lambda_function.my_lambda.function_name
    principal     = "sns.amazonaws.com"
    source_arn    = aws_sns_topic.my_sns_topic.arn
}
        </script>
      </div>
