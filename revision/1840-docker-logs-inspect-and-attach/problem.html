    <p class="rev-crumb">Docker › 3. Running and Managing Containers › Logs, inspect and attach</p>
      <p><strong>Q. How do you view container logs?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
docker logs <id>
docker logs -f <id>  # Real-time logs
        </script>
      </div>
      <p><strong>Q. How do you inspect a running container?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
docker inspect <id>
        </script>
      </div>
      <p><strong>Q. How do you attach to a container terminal?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
docker attach <id>
docker exec -it <id> bash
        </script>
      </div>
