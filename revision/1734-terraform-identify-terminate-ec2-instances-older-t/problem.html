  </summary>
  <div class="q-body rev-card">
    <section class="q-section rev-sec">
    <p class="rev-crumb">Terraform › 20. On-Call: AWS CLI Checks › Identify, terminate EC2 instances older than 30 days?</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
aws ec2 describe-instances --query "Reservations[*].Instances[?LaunchTime<'$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ')'].InstanceId" --output text | xargs -r aws ec2 terminate-instances --instance-ids
        </script>
      </div>
