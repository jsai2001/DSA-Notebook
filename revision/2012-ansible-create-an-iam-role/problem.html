    <p class="rev-crumb">Ansible › 15. Provisioning AWS with Ansible › Create an IAM role</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create an IAM role
  hosts: localhost
  tasks:
    - name: Create IAM role
      amazon.aws.iam_role:
        name: "my-iam-role"
        assume_role_policy_document: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
        managed_policy: "AmazonS3ReadOnlyAccess"
        region: "us-east-1"
        </script>
