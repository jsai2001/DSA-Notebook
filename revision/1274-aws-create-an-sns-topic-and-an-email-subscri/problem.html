    <p class="rev-crumb">AWS › 12. Hands-On: Provisioning with the AWS CLI › Create an SNS topic and an email subscription</p>
      <p><strong>Q. How do you create an SNS topic and subscribe an email endpoint?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Bash">
# Create SNS topic
aws sns create-topic \
    --name my-topic \
    --region us-east-1
# Subscribe email endpoint
aws sns subscribe \
    --topic-arn arn:aws:sns:us-east-1:123456789012:my-topic \
    --protocol email \
    --notification-endpoint user@example.com \
    --region us-east-1
        </script>
      </div>
