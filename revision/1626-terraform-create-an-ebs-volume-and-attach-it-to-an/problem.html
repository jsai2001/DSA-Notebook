    <section class="q-section rev-sec">
    <p class="rev-crumb">Terraform › 13. Hands-On: Compute, Storage and Databases › Create an EBS volume and attach it to an EC2 instance using Terraform</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Hcl">
resource "aws_ebs_volume" "my_volume" {
  availability_zone = "us-east-1a"
  size              = 10
  type              = "gp3"
}

resource "aws_volume_attachment" "my_attachment" {
  device_name = "/dev/xvdf"
  volume_id   = aws_ebs_volume.my_volume.id
  instance_id = aws_instance.my_ec2.id
}
        </script>
