    <section class="q-section rev-sec">
    <p class="rev-crumb">GitHub Actions › 13. Hands-on: AWS resources from workflows › Internet gateway and route table</p>
      <p>Create and attach an internet gateway:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Attach Internet Gateway
  run: |
    IGW_ID=$(aws ec2 create-internet-gateway --query InternetGateway.InternetGatewayId --output text)
    aws ec2 attach-internet-gateway \
      --internet-gateway-id $IGW_ID \
      --vpc-id vpc-12345678
        </script>
      </div>
      <p>Create a route table, add a default route and associate it with a subnet:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Attach Route Table
  run: |
    RTB_ID=$(aws ec2 create-route-table --vpc-id vpc-12345678 --query RouteTable.RouteTableId --output text)
    aws ec2 create-route \
      --route-table-id $RTB_ID \
      --destination-cidr-block 0.0.0.0/0 \
      --gateway-id igw-12345678
    aws ec2 associate-route-table \
      --route-table-id $RTB_ID \
      --subnet-id subnet-12345678
        </script>
      </div>
