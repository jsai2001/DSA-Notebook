    <p class="rev-crumb">Python Automation › 14. API Chaining › Sequential vs parallel</p>
      <p>Sequential: use when a request needs the previous response (the weather and e-commerce chains above). Parallel: use when requests are independent.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
import concurrent.futures

urls = [url1, url2, url3]

def fetch_url(url):
    return requests.get(url)

with concurrent.futures.ThreadPoolExecutor() as executor:
    responses = list(executor.map(fetch_url, urls))
        </script>
