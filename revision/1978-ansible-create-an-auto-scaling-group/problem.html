    <p class="rev-crumb">Ansible › 15. Provisioning AWS with Ansible › Create an Auto Scaling group</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Create an Auto Scaling group
  hosts: localhost
  tasks:
    - name: Create Auto Scaling group
      amazon.aws.autoscaling_group:
        name: "my-asg"
        launch_template:
          name: "my-launch-template"
          version: "$Latest"
        min_size: 1
        max_size: 3
        desired_capacity: 2
        vpc_zone_identifier: ["subnet-12345678", "subnet-87654321"]
        region: "us-east-1"
        </script>
