      <p>(Run <code>makemigrations</code> and <code>migrate</code>.) Name boolean fields as yes/no questions: <code>is_public</code> is clearer than <code>public</code>.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
def change_visibility_view(request, pk):
    if request.method == 'POST':
        note = get_object_or_404(Notes, pk=pk)
        note.is_public = not note.is_public   # flip
        note.save()
        return HttpResponseRedirect(reverse('notes.detail', args=(pk,)))
    raise Http404
        </script>
      </div>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
path('notes/<int:pk>/change-visibility', views.change_visibility_view, name='notes.change-visibility'),
        </script>

      <div class="code-tabs">
        <script type="text/plain" data-lang="HTML">
<h1 class="my-5">
  {{ note.title }}
  {% if note.is_public %}
    <span class="badge bg-secondary">Public</span>
  {% endif %}
</h1>
<form method="POST" action="{% url 'notes.change-visibility' pk=note.id %}" class="d-inline">
  {% csrf_token %}
  {% if note.is_public %}
    <button type="submit" class="btn btn-secondary">Make Private</button>
  {% else %}
    <button type="submit" class="btn btn-secondary">Make Public</button>
  {% endif %}
</form>
        </script>
