    <p class="rev-crumb">Ansible › 6. Modules › lineinfile and user</p>
      <p><strong>Q. What is <code>lineinfile</code> for?</strong> It edits a single line, useful for config tweaks.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
        </script>
      </div>
      <p><strong>Q. Manage users with <code>user</code>?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- user:
    name: appuser
    password: "{{ 'pass' | password_hash('sha512') }}"
    state: present
        </script>
      </div>
