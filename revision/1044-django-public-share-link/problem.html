      <p>No login required, restricted to public notes by the queryset:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
class NotesPublicDetailView(DetailView):
    model = Notes
    context_object_name = 'note'
    template_name = 'notes/notes_detail.html'
    queryset = Notes.objects.filter(is_public=True)
        </script>

path('notes/<int:pk>/share', views.NotesPublicDetailView.as_view(), name='notes.share'),
        </script>

      <p>A private note's pk returns 404, so it is never exposed. The filter is enforced at the query level.</p>
