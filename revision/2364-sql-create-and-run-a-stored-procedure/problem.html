    <p class="rev-crumb">SQL › 7. Stored Procedures › Create and run a stored procedure</p>
      <p>The procedure takes a <code>@JobTitle</code> parameter, fills a temp table, and returns it. After it is created, only the <code>EXEC</code> line is needed on later runs.</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="SQL">
CREATE PROCEDURE Temp_Employee
@JobTitle nvarchar(100)
AS
DROP TABLE IF EXISTS #temp_employee
Create table #temp_employee (
JobTitle varchar(100),
EmployeesPerJob int,
AvgAge int,
AvgSalary int
)
Insert into #temp_employee
SELECT JobTitle, Count(JobTitle), Avg(Age), AVG(salary)
FROM EmployeeDemographics emp
JOIN EmployeeSalary sal
ON emp.EmployeeID = sal.EmployeeID
where JobTitle = @JobTitle
group by JobTitle
Select *
From #temp_employee
GO

EXEC Temp_Employee @JobTitle = 'Salesman'
        </script>
