    <p class="rev-crumb">Fine-Tuning LLMs › 13. Tuning LoRA: Rank, Overfitting, Hyperparameters › 13.2 Choosing the rank</p>
      <p>Adaptive config: raise rank if recent performance is below target, lower it if comfortably above:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
class AdaptiveLoRAConfig:
    def __init__(self, base_rank=8, adaptation_strategy='performance'):
        self.base_rank = base_rank
        self.adaptation_strategy = adaptation_strategy
        self.performance_history = []

    def adapt_rank(self, current_performance, target_performance=0.9):
        """Dynamically adjust rank based on performance"""
        self.performance_history.append(current_performance)

        if len(self.performance_history) < 3:
            return self.base_rank

        recent_trend = self.performance_history[-3:]

        if all(p < target_performance for p in recent_trend):
            # Performance too low, increase rank
            new_rank = min(self.base_rank * 2, 64)
            return new_rank
        elif all(p > target_performance * 1.1 for p in recent_trend):
            # Performance good, try reducing rank for efficiency
            new_rank = max(self.base_rank // 2, 1)
            return new_rank

        return self.base_rank

    def get_lora_config(self, current_performance=None):
        """Get LoRA configuration based on current state"""
        if current_performance:
            rank = self.adapt_rank(current_performance)
        else:
            rank = self.base_rank

        return LoraConfig(
            r=rank,
            lora_alpha=rank * 2,  # Common heuristic
            lora_dropout=0.1,
            target_modules=["q_proj", "v_proj"]
        )

# Usage
adaptive_config = AdaptiveLoRAConfig(base_rank=8)
lora_config = adaptive_config.get_lora_config()
