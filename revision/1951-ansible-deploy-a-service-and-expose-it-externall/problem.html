    <p class="rev-crumb">Ansible › 13. Ansible with Kubernetes and GitHub Actions › Deploy a Service and expose it externally</p>
      <p><strong>Q. Ansible to deploy a K8s Service and expose it externally?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
- name: Deploy service
  hosts: localhost
  tasks:
  - name: Apply
    ansible.builtin.command: kubectl apply -f service.yaml
  - name: Expose
    ansible.builtin.command: kubectl expose service web-service --type=LoadBalancer --port=80 --name=web-lb -n default
        </script>
      </div>
      <p><code>service.yaml</code>:</p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: v1
kind: Service
metadata: { name: web-service }
spec:
  selector: { app: web-app }
  ports: [{ port: 80, targetPort: 8080 }]
  type: ClusterIP
        </script>
      </div>
