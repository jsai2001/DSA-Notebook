    <p class="rev-crumb">Kubernetes › 13. Scenario Questions › Exposing a Deployment</p>
      <p><strong>Q. Write a YAML file to create a Deployment with 3 replicas.</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        </script>
      </div>
      <p><strong>Q. How do you expose a Deployment as a LoadBalancer service?</strong></p>
      <div class="code-tabs">
        <script type="text/plain" data-lang="YAML">
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
        </script>
      </div>
