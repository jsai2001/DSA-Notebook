      <div class="code-tabs">
        <script type="text/plain" data-lang="Python">
import pandas as pd
from sklearn.linear_model import LogisticRegression
log_data = pd.DataFrame({
    'x': [-2, -2.3, -2.1, -1, -.5, 0, .5, .7, 1, 2, 3],
    'y': [0, 0, 0, 0, 1, 0, 1, 1, 1, 1, 1]
})
log_data.plot.scatter(x='x', y='y')
log_r = LogisticRegression()
log_r.fit(log_data[['x']], log_data['y'])  # X must be 2D (DataFrame)
log_r.coef_       # Weight for x
log_r.intercept_  # Bias term
        </script>
      </div>
      <p>Plot the fitted sigmoid over the data:</p>
      <div class="code-tabs">

x = np.linspace(-3, 4, 100)
y = 1 / (1 + np.exp(-(log_r.coef_[0][0] * x + log_r.intercept_[0])))
fig, ax = plt.subplots(figsize=(8, 6))
ax.plot(x, y)

ax.annotate('Predict 1\nright of this', xy=(-.31, .5), xytext=(2, .4),

      <div class="code-tabs">

        </script>
